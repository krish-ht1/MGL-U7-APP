<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yearly Production - Milestone Gear Unit 7</title>
  <!-- Chart.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Chart.js DataLabels Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-M7N15GE8FN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-M7N15GE8FN');
</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: radial-gradient(circle at top, #0f172a 0%, #070d1b 100%);
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .ewm-header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .ewm-brand { display: flex; align-items: center; gap: 8px; }
    .ewm-brand h1 { font-size: 13px; font-weight: 800; margin: 0; color: #f8fafc; letter-spacing: 0.3px; }
    
    .header-right { display: flex; align-items: center; gap: 8px; }
    .home-btn {
      background: #1e293b;
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .ewm-badge { 
      background: rgba(52, 211, 153, 0.15); 
      color: #34d399; 
      border: 1px solid rgba(52, 211, 153, 0.4); 
      padding: 3px 8px; 
      border-radius: 6px; 
      font-size: 10px; 
      font-weight: 700; 
    }

    .ewm-container { max-width: 1600px; width: 100%; margin: 0 auto; padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 12px; }

    /* Navigation Bar with Icons */
    .nav-buttons-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 8px;
      border-radius: 10px;
    }
    .nav-main-btn {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      padding: 6px 4px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-main-btn.active { 
      background: #3b82f6; 
      border-color: #60a5fa; 
      color: #fff; 
    }

    /* Table Section */
    .table-section {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; }
    table.yearly-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 4px;
      font-size: 11px;
      text-align: center;
      white-space: nowrap;
    }
    table.yearly-table th {
      background: rgba(30, 41, 59, 0.95);
      color: #38bdf8;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.5px;
      padding: 10px 8px;
      border: none;
    }
    table.yearly-table th:first-child { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
    table.yearly-table th:last-child { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }

    table.yearly-table td {
      background: rgba(30, 41, 59, 0.4);
      padding: 10px 8px;
      border: none;
      font-weight: 600;
    }
    table.yearly-table tr td:first-child { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
    table.yearly-table tr td:last-child { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }

    /* Graph Card */
    .graph-card {
      background: linear-gradient(145deg, #0b1120 0%, #0f172a 100%);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }
    .graph-legend {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 10px;
      font-weight: 700;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px;
      border-radius: 8px;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .graph-container { position: relative; width: 100%; height: 320px; }

    @media (min-width: 769px) {
      .ewm-container { padding: 18px; gap: 16px; }
      .ewm-brand h1 { font-size: 15px; }
      .nav-main-btn { font-size: 11.5px; padding: 8px 6px; }
      .graph-container { height: 400px; }
      .table-section { padding: 18px; }
      table.yearly-table { font-size: 12px; }
      table.yearly-table th, table.yearly-table td { padding: 12px 14px; }
    }
  </style>
</head>
<body>

  <header class="ewm-header">
    <div class="ewm-brand">
      <span style="font-size: 16px;">📈</span>
      <h1>Milestone Gear Unit 7 - Yearly Production</h1>
    </div>
    <div class="header-right">
      <a href="index.html" class="home-btn">🏠 Home</a>
      <div class="ewm-badge" id="syncStatus">● Live</div>
    </div>
  </header>

  <div class="ewm-container">

    <!-- Sub-Module Navigation with Icons -->
    <div class="nav-buttons-bar">
  <a href="production.html" class="nav-main-btn">📅 Daily</a>
  <a href="monthly.html" class="nav-main-btn">📊 Monthly</a>
  <a href="yearly.html" class="nav-main-btn">📈 Yearly</a>
  <a href="losses.html" class="nav-main-btn">⚠️ Losses</a>
</div>
    <!-- Table Section -->
    <div class="table-section">
      <div style="margin-bottom: 8px; font-weight: 700; font-size: 12px; color: #38bdf8;">📊 Performance Summary</div>
      <div class="table-scroll">
        <table class="yearly-table">
          <thead>
            <tr>
              <th>Year</th>
              <th>Prod (MT)</th>
              <th>Target</th>
              <th>Avg/Mon</th>
              <th>Achv%</th>
            </tr>
          </thead>
          <tbody id="yearlyTableBody">
            <tr><td colspan="5" style="padding: 16px; color: #94a3b8;">Loading live data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Graph Section -->
    <div class="graph-card">
      <h3 style="margin: 0; font-size: 12.5px; font-weight: 700; color: #f8fafc;">✨ Performance Matrix</h3>
      <div class="graph-legend">
        <div class="legend-item" style="color: #38bdf8;"><span style="width: 10px; height: 10px; background: #38bdf8; display: inline-block; border-radius: 2px;"></span> Prod</div>
        <div class="legend-item" style="color: #fb923c;"><span style="width: 10px; height: 10px; background: #fb923c; display: inline-block; border-radius: 50%;"></span> Target</div>
        <div class="legend-item" style="color: #ec4899;"><span style="width: 10px; height: 10px; background: #ec4899; display: inline-block; border-radius: 2px;"></span> Avg/M</div>
      </div>
      <div class="graph-container">
        <canvas id="yearlyChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    const YEARLY_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRu_55_JgWvZY0QyC87pldI3sKILOrXLYsE8xiuB99-K2ll9jWI5HHYIU6aoxEF1hegbDDmRybDQsW2/pub?gid=1784889536&single=true&output=csv";

    let yearlyData = [];
    let yearlyChartInstance = null;

    async function fetchYearlyLive() {
      try {
        const response = await fetch(YEARLY_CSV_URL);
        const csvText = await response.text();
        const rows = csvText.split('\n').map(r => r.split(','));

        yearlyData = [];
        for (let i = 1; i < rows.length; i++) {
          let r = rows[i];
          if (!r || r.length < 4) continue;
          let yearCol = r[0] ? r[0].replace(/["']/g, "").trim() : "";
          
          if (yearCol && (yearCol.includes("FY") || yearCol.includes("202") || yearCol.includes("203"))) {
            let parseVal = (val) => {
              if (!val) return 0;
              let clean = String(val).replace(/["']/g, "").replace(/,/g, "").trim();
              let num = parseFloat(clean);
              return isNaN(num) ? 0 : num;
            };

            let prod = parseVal(r[1]);
            let target = parseVal(r[2]);
            let avgM = parseVal(r[3]);
            let percentage = target > 0 ? ((prod / target) * 100).toFixed(1) : 0;

            yearlyData.push({
              year: yearCol,
              production: prod,
              target: target,
              avgMonth: avgM,
              percentage: percentage
            });
          }
        }

        if (yearlyData.length === 0) {
          yearlyData = [
            { year: "FY-2021~22", production: 1479, target: 1920, avgMonth: 123.25, percentage: 77.0 },
            { year: "FY-2022~23", production: 2080, target: 2340, avgMonth: 173.34, percentage: 88.9 },
            { year: "FY-2023~24", production: 1843, target: 2400, avgMonth: 152.84, percentage: 76.8 },
            { year: "FY-2024~25", production: 2245, target: 2760, avgMonth: 187.17, percentage: 81.3 },
            { year: "FY-2025~26", production: 3032, target: 3000, avgMonth: 252.70, percentage: 101.1 },
            { year: "FY-2026~27", production: 1009, target: 3120, avgMonth: 252.27, percentage: 32.4 }
          ];
        }

        renderYearlyTable();
        document.getElementById('syncStatus').innerText = "● Live";
        document.getElementById('syncStatus').style.color = "#34d399";
      } catch (err) {
        console.log("Error loading CSV, using fallback:", err);
        yearlyData = [
          { year: "FY-2021~22", production: 1479, target: 1920, avgMonth: 123.25, percentage: 77.0 },
          { year: "FY-2022~23", production: 2080, target: 2340, avgMonth: 173.34, percentage: 88.9 },
          { year: "FY-2023~24", production: 1843, target: 2400, avgMonth: 152.84, percentage: 76.8 },
          { year: "FY-2024~25", production: 2245, target: 2760, avgMonth: 187.17, percentage: 81.3 },
          { year: "FY-2025~26", production: 3032, target: 3000, avgMonth: 252.70, percentage: 101.1 },
          { year: "FY-2026~27", production: 1009, target: 3120, avgMonth: 252.27, percentage: 32.4 }
        ];
        renderYearlyTable();
        document.getElementById('syncStatus').innerText = "● Cached";
        document.getElementById('syncStatus').style.color = "#fb923c";
      }
    }

    function renderYearlyTable() {
      const tbody = document.getElementById('yearlyTableBody');
      let html = "";

      let labels = [];
      let productionValues = [];
      let targetValues = [];
      let avgMonthValues = [];

      yearlyData.forEach(row => {
        labels.push(row.year);
        productionValues.push(row.production);
        targetValues.push(row.target);
        avgMonthValues.push(row.avgMonth);

        let badgeColor = row.percentage >= 100 ? '#34d399' : '#fb923c';

        html += `
          <tr>
            <td style="font-weight:800; color:#38bdf8;">${row.year}</td>
            <td style="color:#60a5fa;">${row.production.toLocaleString('en-IN')}</td>
            <td style="color:#fb923c;">${row.target.toLocaleString('en-IN')}</td>
            <td style="color:#ec4899;">${row.avgMonth.toLocaleString('en-IN', {minimumFractionDigits: 1, maximumFractionDigits: 1})}</td>
            <td><span style="background: rgba(52, 211, 153, 0.15); color: ${badgeColor}; padding: 3px 6px; border-radius: 4px; font-weight: 700;">${row.percentage}%</span></td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
      renderYearly3DChart(labels, productionValues, targetValues, avgMonthValues);
    }

    function renderYearly3DChart(labels, production, targets, avgs) {
      const ctx = document.getElementById('yearlyChart').getContext('2d');
      const isMobile = window.innerWidth <= 768;

      let gradProd = ctx.createLinearGradient(0, 0, 0, 300);
      gradProd.addColorStop(0, '#38bdf8');
      gradProd.addColorStop(1, '#1e40af');

      let gradPink = ctx.createLinearGradient(0, 0, 0, 300);
      gradPink.addColorStop(0, '#f472b6');
      gradPink.addColorStop(1, '#be185d');

      if (yearlyChartInstance) {
        yearlyChartInstance.destroy();
      }

      yearlyChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Production',
              data: production,
              backgroundColor: gradProd,
              borderRadius: 6,
              borderWidth: 0,
              yAxisID: 'y',
              order: 2
            },
            {
              label: 'Avg/Mon',
              data: avgs,
              backgroundColor: gradPink,
              borderRadius: 6,
              borderWidth: 0,
              yAxisID: 'y1',
              order: 3
            },
            {
              label: 'Target',
              data: targets,
              type: 'line',
              borderColor: '#fb923c',
              backgroundColor: '#fb923c',
              borderWidth: 3,
              pointRadius: 4,
              pointBackgroundColor: '#0f172a',
              pointBorderColor: '#fb923c',
              pointBorderWidth: 2,
              tension: 0.25,
              yAxisID: 'y',
              order: 1
            }
          ]
        },
        plugins: [ChartDataLabels],
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            datalabels: {
              anchor: function(context) {
                if (context.dataset.type === 'line') return 'end';
                return isMobile ? 'center' : 'end';
              },
              align: function(context) {
                if (context.dataset.type === 'line') return 'top';
                return isMobile ? 'center' : 'top';
              },
              color: function(context) {
                return context.dataset.type === 'line' ? '#fb923c' : '#ffffff';
              },
              font: { family: 'Inter', size: isMobile ? 8 : 10, weight: '700' },
              // फोन पर बार के अंदर वैल्यूज़ वर्टिकल (90 डिग्री) रहेंगी ताकि कॉलम के अंदर फिट आएं, वेब पर बिल्कुल सीधी रहेंगी
              rotation: function(context) {
                if (isMobile && context.dataset.type !== 'line') return -90;
                return 0;
              },
              formatter: function(value) {
                return value > 0 ? value : '';
              }
            },
            tooltip: { 
              backgroundColor: 'rgba(15, 23, 42, 0.95)', 
              titleColor: '#38bdf8', 
              bodyColor: '#f8fafc', 
              borderColor: 'rgba(56,189,248,0.4)', 
              borderWidth: 1,
              padding: 8
            }
          },
          scales: {
            x: { 
              grid: { display: false }, 
              ticks: { color: '#94a3b8', font: { size: isMobile ? 9.5 : 11, weight: '700' } } 
            },
            y: {
              type: 'linear',
              position: 'left',
              grid: { display: false },
              ticks: { color: '#38bdf8', font: { size: isMobile ? 8.5 : 10 } }
            },
            y1: {
              type: 'linear',
              position: 'right',
              grid: { display: false },
              ticks: { color: '#ec4899', font: { size: isMobile ? 8.5 : 10 } }
            }
          }
        }
      });
    }

    window.addEventListener('DOMContentLoaded', fetchYearlyLive);
  </script>
</body>
</html>
