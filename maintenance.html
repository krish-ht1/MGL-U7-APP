<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HT Maintenance Hub - Milestone Gear</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: #0b1120;
            color: #e2e8f0;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .top-bar {
            position: sticky;
            top: 0;
            background: #1e293b;
            border-bottom: 2px solid #f97316;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            z-index: 1000;
        }
        .nav-left { display: flex; align-items: center; gap: 12px; }
        .back-btn {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f97316;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            font-size: 12px;
            transition: 0.2s;
        }
        .back-btn:hover { background: #f97316; color: white; }
        .nav-left h1 { font-size: 15px; margin: 0; color: #f8fafc; font-weight: 600; }

        .main-container {
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Tabs Bar */
        .tabs-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            background: #1e293b;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #334155;
        }
        .tab-btn {
            background: #0f172a;
            border: 1px solid #475569;
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active, .tab-btn:hover {
            background: #f97316;
            color: white;
            border-color: #f97316;
            box-shadow: 0 4px 14px rgba(249, 115, 22, 0.35);
        }

        .content-section {
            display: none;
            flex-direction: column;
            gap: 16px;
        }
        .content-section.active {
            display: flex;
        }

        .section-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
        }

        /* Search Box */
        .search-box {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            margin-bottom: 12px;
            font-family: inherit;
        }
        .search-box:focus { border-color: #f97316; }

        /* Clean Table Styling with auto-fit width behavior */
        .table-responsive {
            overflow-x: auto;
            max-height: 550px;
            border-radius: 8px;
            border: 1px solid #475569;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11.5px;
            text-align: left;
        }
        th {
            background: #0284c7;
            color: white;
            padding: 10px 12px;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
            border: 1px solid #0369a1;
            white-space: nowrap;
        }
        td {
            padding: 8px 12px;
            border: 1px solid #475569;
            color: #cbd5e1;
            background: #0f172a;
            white-space: nowrap; /* text ke mutabik width fit rakhne ke liye */
        }
        tr:hover td { background: rgba(249, 115, 22, 0.08); color: #fff; }

        .no-data { padding: 30px; text-align: center; color: #94a3b8; font-size: 13px; }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="nav-left">
            <a href="index.html" class="back-btn">⬅ Home</a>
            <h1>⚙️ HT Maintenance Master Hub</h1>
        </div>
        <span style="font-size: 11px; color: #34d399; font-weight: 600;">● Live Synced</span>
    </header>

    <div class="main-container">
        
        <!-- Navigation Tabs -->
        <div class="tabs-bar">
            <button class="tab-btn active" onclick="switchMaintenanceTab('pm', this)">📅 PM Schedule</button>
            <button class="tab-btn" onclick="switchMaintenanceTab('spares', this)">🛠️ Critical Spare List</button>
            <button class="tab-btn" onclick="switchMaintenanceTab('calib', this)">📏 Calibration Master List</button>
        </div>

        <!-- 1. PM Schedule Section -->
        <div id="section-pm" class="content-section active">
            <div class="section-card">
                <div class="section-title"><span>📋 Preventive Maintenance Schedule 2026-2027</span></div>
                <div class="table-responsive">
                    <table style="text-align: center;">
                        <thead id="pmThead"><tr><th>Loading...</th></tr></thead>
                        <tbody id="pmTableBody"><tr><td colspan="15" class="no-data">Loading PM Schedule...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 2. Critical Spare List Section with Search Box -->
        <div id="section-spares" class="content-section">
            <div class="section-card">
                <div class="section-title"><span>🛠️ Critical Spare Parts Stock & List</span></div>
                <input type="text" id="spareSearch" class="search-box" placeholder="🔍 Search by Description, Part Number or Item Code..." onkeyup="filterSparesTable()">
                <div class="table-responsive">
                    <table>
                        <thead id="sparesThead"><tr><th>Loading Headers...</th></tr></thead>
                        <tbody id="sparesTableBody"><tr><td colspan="7" class="no-data">Loading Critical Spares...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 3. Calibration Master List Section -->
        <div id="section-calib" class="content-section">
            <div class="section-card">
                <div class="section-title"><span>📏 Instrument Calibration Master List</span></div>
                <input type="text" id="calibrationSearch" class="search-box" placeholder="🔍 Search by Instrument Name, Make, ID or Location..." onkeyup="filterCalibrationTable()">
                <div class="table-responsive">
                    <table>
                        <thead id="calibThead"><tr><th>Loading Headers...</th></tr></thead>
                        <tbody id="calibrationTableBody"><tr><td colspan="9" class="no-data">Loading Calibration Records...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        function switchMaintenanceTab(tabId, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('section-' + tabId).classList.add('active');
        }

        const PM_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSIjTl05F8eko2YsYFg78qhfZg8vmdx1xYk29kNTnOn5C01lp78J0BuB3CP8OyT8C8qXhQv8PRVSwVK/pub?gid=1943594971&single=true&output=csv";
        const SPARES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSIjTl05F8eko2YsYFg78qhfZg8vmdx1xYk29kNTnOn5C01lp78J0BuB3CP8OyT8C8qXhQv8PRVSwVK/pub?gid=1304634560&single=true&output=csv";
        const calibration_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSIjTl05F8eko2YsYFg78qhfZg8vmdx1xYk29kNTnOn5C01lp78J0BuB3CP8OyT8C8qXhQv8PRVSwVK/pub?gid=2037689190&single=true&output=csv";
        let rawSparesData = [];
        let sparesHeaders = [];

        function parseCSV(text) {
            return text.split('\n').map(r => {
                let row = [], insideQuote = false, entry = '';
                for (let char of r) {
                    if (char === '"') { insideQuote = !insideQuote; }
                    else if (char === ',' && !insideQuote) { row.push(entry.trim()); entry = ''; }
                    else { entry += char; }
                }
                row.push(entry.trim());
                return row;
            });
        }

        async function fetchPMSchedule() {
            try {
                const res = await fetch(`${PM_CSV_URL}&_t=${Date.now()}`);
                const text = await res.text();
                const rows = parseCSV(text);
                if (rows.length > 0) {
                    let thHtml = `<tr>`;
                    rows[0].forEach(h => thHtml += `<th>${h || ''}</th>`);
                    thHtml += `</tr>`;
                    document.getElementById('pmThead').innerHTML = thHtml;

                    let html = "";
                    rows.slice(1).forEach(r => {
                        if (r.length > 1 && r.some(c => c !== '')) {
                            html += `<tr>`;
                            r.forEach(cell => html += `<td>${cell || '-'}</td>`);
                            html += `</tr>`;
                        }
                    });
                    document.getElementById('pmTableBody').innerHTML = html;
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function fetchCriticalSpares() {
            try {
                const res = await fetch(`${SPARES_CSV_URL}&_t=${Date.now()}`);
                const text = await res.text();
                const rows = parseCSV(text);
                if (rows.length > 0) {
                    sparesHeaders = rows[0];
                    let thHtml = `<tr>`;
                    sparesHeaders.forEach(h => thHtml += `<th>${h || ''}</th>`);
                    thHtml += `</tr>`;
                    document.getElementById('sparesThead').innerHTML = thHtml;

                    rawSparesData = rows.slice(1).filter(r => r.length > 1 && r.some(c => c !== ''));
                    renderSparesTable(rawSparesData);
                }
            } catch (e) {
                document.getElementById('sparesTableBody').innerHTML = `<tr><td colspan="7" class="no-data" style="color:#ef4444;">Error loading spares list.</td></tr>`;
            }
        }

        function renderSparesTable(rows) {
            const tbody = document.getElementById('sparesTableBody');
            if (rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="no-data">No matching spare parts found.</td></tr>`;
                return;
            }
            let html = "";
            rows.forEach(r => {
                html += `<tr>`;
                r.forEach(cell => html += `<td>${cell || '-'}</td>`);
                html += `</tr>`;
            });
            tbody.innerHTML = html;
        }

        function filterSparesTable() {
            const query = document.getElementById('spareSearch').value.toLowerCase().trim();
            const filtered = rawSparesData.filter(r => {
                return r.some(col => String(col).toLowerCase().includes(query));
            });
            renderSparesTable(filtered);
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchPMSchedule();
            fetchCriticalSpares();
        });
    </script>
</body>
</html>
