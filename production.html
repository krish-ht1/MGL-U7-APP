<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Milestone Gear Unit 7 - Production Review Dashboard</title>
  <!-- Chart.js for Graph -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: #070d1b; color: #e2e8f0; font-family: 'Inter', sans-serif;
      margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column;
    }
    .ewm-header {
      background: #0f172a; border-bottom: 1px solid #1e293b; padding: 10px 16px;
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000;
    }
    .ewm-brand { display: flex; align-items: center; gap: 8px; }
    .ewm-brand h1 { font-size: 12.5px; font-weight: 700; margin: 0; color: #f8fafc; }
    .header-right { display: flex; align-items: center; gap: 6px; }
    .home-btn {
      background: #1e293b; border: 1px solid #334155; color: #38bdf8;
      padding: 4px 8px; border-radius: 6px; font-size: 10.5px; font-weight: 600; text-decoration: none;
    }
    .ewm-badge { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); padding: 2px 6px; border-radius: 6px; font-size: 10px; font-weight: 600; }
    .ewm-container { max-width: 1600px; width: 100%; margin: 0 auto; padding: 10px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
    
    .nav-buttons-bar {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
      background: #0f172a; border: 1px solid #1e293b; padding: 8px; border-radius: 8px;
    }
    .nav-main-btn {
      background: #1e293b; border: 1px solid #334155; color: #94a3b8;
      padding: 6px 4px; border-radius: 6px; font-size: 10px; font-weight: 700; text-align: center; text-decoration: none;
    }
    .nav-main-btn.active, .nav-main-btn:hover { background: #3b82f6; border-color: #3b82f6; color: #fff; }
    
    .module-view { display: none; flex-direction: column; gap: 10px; }
    .module-view.active { display: flex; }
    
    .control-bar {
      background: #0f172a; border: 1px solid #1e293b; border-radius: 8px;
      padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }
    .month-select-wrap { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: #94a3b8; }
    .month-select-wrap select {
      background: #1e293b; border: 1px solid #334155; color: #f8fafc;
      padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; outline: none; cursor: pointer;
    }
    
    /* Super Compact & Attractive KPI Cards for Mobile */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    @media (min-width: 768px) {
      .kpi-grid { grid-template-columns: repeat(5, 1fr); }
    }
    .kpi-card-mini {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .kpi-title-mini {
      font-size: 9.5px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .kpi-val-mini {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
      margin-top: 2px;
    }

    .dwm-section {
      background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px;
    }
    .dwm-title-row { display: flex; justify-content: space-between; align-items: center; }
    .dwm-title-row h3 { font-size: 11.5px; font-weight: 700; color: #f8fafc; margin: 0; }
    
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; max-height: 350px; }
    table.dwm-table { width: 100%; border-collapse: collapse; font-size: 10px; text-align: center; white-space: nowrap; }
    table.dwm-table th, table.dwm-table td { border: 1px solid #334155; padding: 4px 6px; }
    table.dwm-table th { background: #1e293b; color: #94a3b8; font-weight: 600; position: sticky; top: 0; z-index: 5; }
    table.dwm-table td { background: #0f172a; color: #f1f5f9; }
    
    .cell-green { background: rgba(16, 185, 129, 0.2) !important; color: #34d399 !important; font-weight: 600; }
    .cell-red { background: rgba(239, 68, 68, 0.2) !important; color: #f87171 !important; font-weight: 600; }
    .total-row { background: #1e293b !important; font-weight: 700; color: #38bdf8 !important; }

    /* Graph Section Container */
    .graph-section {
      background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px;
    }
    .graph-container {
      position: relative; width: 100%; height: 220px;
    }
  </style>
</head>

          "SQF-4": [2.41, 1.81, 2.48, 1.97, 2.84, 1.93, 2.85, 2.54, 1.98, 2.15, 2.86, 1.73, 2.79, 2.97, 1.62, 3.04, 2.13, 2.07, 3.04, 1.88, 2.49, 2.41, 2.51, 2.54, 2.61, 1.83, 1.83, 2.62, 1.45, 1.60]

        furnaces: {

        }
      }
    };

    let liveAugustData = {
      daysCount: 31,
      monthTarget: 279.0,
      totalTargetMTD: 243.0,
      furnaces: {
        "SQF-1": { capacity: 69.75, monthTarget: 69.75, targetMTD: 60.75, days: Array(31).fill(0) },
        "SQF-2": { capacity: 69.75, monthTarget: 69.75, targetMTD: 60.75, days: Array(31).fill(0) },
        "SQF-3": { capacity: 69.75, monthTarget: 69.75, targetMTD: 60.75, days: Array(31).fill(0) },
        "SQF-4": { capacity: 69.75, monthTarget: 69.75, targetMTD: 60.75, days: Array(31).fill(0) }
      }
    };

    let prodChart = null;

    function parseCSV(text) {
      return text.split('\n').map(r => {
        let row = [];
        let insideQuote = false;
        let entry = '';
        for (let char of r) {
          if (char === '"') { insideQuote = !insideQuote; }
          else if (char === ',' && !insideQuote) { row.push(entry.trim()); entry = ''; }
          else { entry += char; }
        }
        row.push(entry.trim());
        return row;
      });
    }

    async function fetchAugustLiveSheet() {
      const selectedMonth = document.getElementById('dwmMonthDropdown').value;
      const syncStatus = document.getElementById('syncStatus');

      if (selectedMonth !== "AUGUST-2026") {
        if(syncStatus) { syncStatus.innerText = `● Fixed (${selectedMonth})`; syncStatus.style.color = "#38bdf8"; }
        renderDWMData();
        return;
      }

      try {
        const timestamp = new Date().getTime();
        const response = await fetch(`${LIVE_CSV_URL}&_t=${timestamp}`);
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        rows.forEach(r => {
          let rowStr = r.join(" ").toUpperCase();
          let fcName = "";
          if (rowStr.includes("SQF-1")) fcName = "SQF-1";
          else if (rowStr.includes("SQF-2")) fcName = "SQF-2";
          else if (rowStr.includes("SQF-3")) fcName = "SQF-3";
          else if (rowStr.includes("SQF-4")) fcName = "SQF-4";

          if (fcName && liveAugustData.furnaces[fcName]) {
            if (r[1] && !isNaN(parseFloat(r[1]))) liveAugustData.furnaces[fcName].capacity = parseFloat(r[1]);
            if (r[2] && !isNaN(parseFloat(r[2]))) liveAugustData.furnaces[fcName].monthTarget = parseFloat(r[2]);
            if (r[3] && !isNaN(parseFloat(r[3]))) liveAugustData.furnaces[fcName].targetMTD = parseFloat(r[3]);

            let dayValues = [];
            for (let j = 6; j < r.length; j++) {
              let val = parseFloat(r[j]);
              if (!isNaN(val) && r[j] !== "") dayValues.push(val);
            }
            if (dayValues.length > 0) {
              for (let d = 0; d < Math.min(dayValues.length, 31); d++) {
                liveAugustData.furnaces[fcName].days[d] = dayValues[d];
              }
            }
          }

          if (rowStr.includes("TOTAL IN TON") || rowStr.includes("TOTAL")) {
            if (r[3] && !isNaN(parseFloat(r[3]))) {
              liveAugustData.totalTargetMTD = parseFloat(r[3]);
            }
          }
        });

        if(syncStatus) { syncStatus.innerText = "● Live Synced"; syncStatus.style.color = "#34d399"; }
        renderDWMData();
      } catch (err) {
        console.error("Live fetch error:", err);
        if(syncStatus) { syncStatus.innerText = "● Offline"; syncStatus.style.color = "#f59e0b"; }
        renderDWMData();
      }
    }

    function renderDWMData() {
      const selectedMonth = document.getElementById('dwmMonthDropdown').value;
      let dataDaysCount = 31;
      let monthTarget = 279.0;
      let totalTargetMTD = 243.0;
      let furnacesMap = {};

      if (selectedMonth === "AUGUST-2026") {
        dataDaysCount = liveAugustData.daysCount;
        monthTarget = liveAugustData.monthTarget;
        totalTargetMTD = liveAugustData.totalTargetMTD;
        furnacesMap = liveAugustData.furnaces;
      } else {
        let fData = fixedDatabase[selectedMonth];
        dataDaysCount = fData.daysCount;
        monthTarget = fData.monthTarget;
        totalTargetMTD = fData.totalTargetMTD || 270.0;
        
        furnacesMap = {
          "SQF-1": { capacity: 69.75, monthTarget: 69.75, targetMTD: totalTargetMTD/4, days: fData.furnaces["SQF-1"] },
          "SQF-2": { capacity: 69.75, monthTarget: 69.75, targetMTD: totalTargetMTD/4, days: fData.furnaces["SQF-2"] },
          "SQF-3": { capacity: 69.75, monthTarget: 69.75, targetMTD: totalTargetMTD/4, days: fData.furnaces["SQF-3"] },
          "SQF-4": { capacity: 69.75, monthTarget: 69.75, targetMTD: totalTargetMTD/4, days: fData.furnaces["SQF-4"] }
        };
      }

      let headerHtml = `<th style="min-width: 80px;">FURNACE</th><th>Cap</th><th>Month Target</th><th>Target MTD</th><th>Actual MTD</th><th>Util %</th>`;
      for(let d = 1; d <= dataDaysCount; d++) { headerHtml += `<th>${d}</th>`; }
      document.getElementById('dwmHeaderRow').innerHTML = headerHtml;

      let actualMTD = 0;
      let totals = Array(dataDaysCount).fill(0);
      let tbodyHtml = "";

      Object.keys(furnacesMap).forEach(fcName => {
        let fc = furnacesMap[fcName];
        let daysArr = fc.days;
        let fActual = daysArr.slice(0, dataDaysCount).reduce((a, b) => a + (b || 0), 0);
        actualMTD += fActual;

        let util = fc.targetMTD > 0 ? ((fActual / fc.targetMTD) * 100).toFixed(1) + "%" : "0.0%";

        tbodyHtml += `<tr>
          <td style="font-weight:700; color:#38bdf8;">${fcName}</td>
          <td>${fc.capacity || 69.75}</td>
          <td>${fc.monthTarget || 69.75}</td>
          <td style="font-weight:600; color:#fbbf24;">${fc.targetMTD !== undefined ? fc.targetMTD.toFixed(2) : '-'}</td>
          <td style="font-weight:700;">${fActual.toFixed(2)}</td>
          <td>${util}</td>`;

        for(let i = 0; i < dataDaysCount; i++) {
          let val = daysArr[i] || 0;
          totals[i] += val;
          let cssClass = val >= 2.25 ? "cell-green" : (val > 0 ? "cell-red" : "");
          tbodyHtml += `<td class="${cssClass}">${val > 0 ? val.toFixed(2) : '-'}</td>`;
        }
        tbodyHtml += `</tr>`;
      });

      tbodyHtml += `<tr class="total-row">
        <td>TOTAL TON</td>
        <td>${monthTarget}</td>
        <td>${monthTarget}</td>
        <td>${totalTargetMTD.toFixed(2)}</td>
        <td>${actualMTD.toFixed(2)}</td>
        <td>${totalTargetMTD > 0 ? ((actualMTD/totalTargetMTD)*100).toFixed(1) : 0}%</td>`;
      totals.forEach(t => { tbodyHtml += `<td>${t > 0 ? t.toFixed(2) : '-'}</td>`; });
      tbodyHtml += `</tr>`;

      document.getElementById('dwmTableBody').innerHTML = tbodyHtml;

      // Update KPI Mini Cards
      document.getElementById('kpiMonthTarget').innerText = `${monthTarget} T`;
      document.getElementById('kpiTargetMTD').innerText = `${totalTargetMTD.toFixed(2)} T`;
      document.getElementById('kpiActualMTD').innerText = `${actualMTD.toFixed(2)} T`;
      
      let daysWithProd = totals.filter(x => x > 0).length || 1;
      document.getElementById('kpiAvgProd').innerText = `${(actualMTD / daysWithProd).toFixed(2)} T/Day`;
      
      let variance = (actualMTD - totalTargetMTD).toFixed(2);
      let varEl = document.getElementById('kpiVariance');
      varEl.innerText = `${variance} T`;
      varEl.style.color = variance >= 0 ? "#34d399" : "#f87171";
      document.getElementById('dwmTitleTitle').innerText = `📋 Daily Work Management (DWM) - ${selectedMonth}`;

      // Update Chart
      updateProductionChart(Array.from({length: dataDaysCount}, (_, i) => i + 1), totals);
    }

    function updateProductionChart(labels, dataValues) {
      const ctx = document.getElementById('productionTrendChart').getContext('2d');
      if (prodChart) { prodChart.destroy(); }

      prodChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Daily Production (Ton)',
            data: dataValues,
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.1)',
            borderWidth: 2,
            pointRadius: 2,
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8', font: { size: 9 } } },
            y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8', font: { size: 9 } } }
          }
        }
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      fetchAugustLiveSheet();
    });
  </script>
