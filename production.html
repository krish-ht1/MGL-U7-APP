<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Production DWM Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: #0b1120;
      color: #e2e8f0;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .top-bar {
      position: sticky;
      top: 0;
      background: #1e293b;
      border-bottom: 2px solid #f97316;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      z-index: 1000;
    }
    .nav-left { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      background: #0f172a;
      border: 1px solid #334155;
      color: #f97316;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
      font-size: 12px;
      transition: 0.2s;
    }
    .back-btn:hover { background: #f97316; color: white; }
    .nav-left h1 { font-size: 15px; margin: 0; color: #f8fafc; font-weight: 600; }

    .add-btn {
      background: #f97316;
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: 0.2s;
      box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3);
    }
    .add-btn:hover { background: #ea580c; }

    .dashboard-container {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      flex: 1;
    }

    /* KPI Ribbon */
    .summary-ribbon {
      background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-left: 4px solid #34d399;
      border-radius: 8px;
      padding: 12px 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .ribbon-item { display: flex; align-items: center; gap: 10px; }
    .ribbon-icon {
      font-size: 18px;
      background: rgba(52, 211, 153, 0.1);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: #34d399;
      flex-shrink: 0;
    }
    .ribbon-meta h5 { margin: 0; font-size: 10.5px; color: #94a3b8; text-transform: uppercase; }
    .ribbon-meta p { margin: 2px 0 0 0; font-size: 15px; font-weight: 700; color: #f8fafc; }

    /* Table Container */
    .table-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .table-top-meta {
      padding: 10px 14px;
      background: #111827;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #38bdf8;
      font-weight: 600;
    }
    .table-scroll-wrap {
      overflow-x: auto;
      max-height: 600px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
      white-space: nowrap;
      text-align: center;
    }
    th {
      background: #0f172a;
      color: #94a3b8;
      padding: 10px;
      font-weight: 600;
      position: sticky;
      top: 0;
      border-bottom: 1px solid #334155;
      text-transform: uppercase;
    }
    td {
      padding: 8px 10px;
      border-bottom: 1px solid #334155;
      color: #cbd5e1;
    }
    tr:nth-child(even) td { background: #1e293b; }
    tr:nth-child(odd) td { background: #0f172a; }
    tr:hover td { background: rgba(56, 189, 248, 0.1); color: #ffffff; }

    .sqf-badge {
      background: rgba(249, 115, 22, 0.15);
      color: #f97316;
      border: 1px solid rgba(249, 115, 22, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    /* Modal (DWM Entry Form) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .modal-content {
      background: #1e293b;
      border: 1px solid #38bdf8;
      border-radius: 10px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 12px 16px;
      background: #0f172a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      border-radius: 10px 10px 0 0;
    }
    .modal-header h3 { margin: 0; color: #38bdf8; font-size: 14px; }
    .close-btn { font-size: 22px; cursor: pointer; color: #94a3b8; line-height: 1; }
    
    .modal-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
    .form-group input, .form-group select, .form-group textarea {
      background: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: #38bdf8;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .submit-btn {
      background: #34d399;
      color: #022c22;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.2s;
    }
    .submit-btn:hover { background: #10b981; }

    @media (max-width: 768px) {
      .top-bar { padding: 8px 12px; }
      .nav-left h1 { font-size: 13px; }
      .summary-ribbon { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="nav-left">
      <a href="index.html" class="back-btn">⬅ Home</a>
      <h1>🏭 Production DWM Dashboard</h1>
    </div>
    <button class="add-btn" onclick="openDwmModal()">➕ Add Entry</button>
  </header>

  <div class="dashboard-container">
    
    <!-- KPI Ribbon -->
    <div class="summary-ribbon">
      <div class="ribbon-item">
        <div class="ribbon-icon" style="color: #38bdf8; background: rgba(56, 189, 248, 0.1);">🎯</div>
        <div class="ribbon-meta">
          <h5>Total Target</h5>
          <p id="kpiTarget">0 Pcs</p>
        </div>
      </div>
      <div class="ribbon-item">
        <div class="ribbon-icon">✅</div>
        <div class="ribbon-meta">
          <h5>Total Produced</h5>
          <p id="kpiProduced">0 Pcs</p>
        </div>
      </div>
      <div class="ribbon-item">
        <div class="ribbon-icon" style="color: #ef4444; background: rgba(239, 68, 68, 0.1);">❌</div>
        <div class="ribbon-meta">
          <h5>Total Rejection</h5>
          <p id="kpiRejection">0 Pcs</p>
        </div>
      </div>
      <div class="ribbon-item">
        <div class="ribbon-icon" style="color: #fde047; background: rgba(253, 224, 71, 0.1);">⏱️</div>
        <div class="ribbon-meta">
          <h5>Downtime</h5>
          <p id="kpiDowntime">0 Mins</p>
        </div>
      </div>
    </div>

    <!-- Data Table -->
    <div class="table-card">
      <div class="table-top-meta">
        <span>📋 Recent Production Logs (Dummy Data)</span>
      </div>
      <div class="table-scroll-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Furnace</th>
              <th>Part No</th>
              <th>Target</th>
              <th>Produced</th>
              <th>Rejection</th>
              <th>Downtime (Min)</th>
              <th>Remarks</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Data populated by JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Entry Form Modal -->
  <div class="modal-overlay" id="dwmModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📝 Add DWM Production Entry</h3>
        <span class="close-btn" onclick="closeDwmModal()">&times;</span>
      </div>
      <div class="modal-body">
        <div class="row-2">
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="entryDate" required>
          </div>
          <div class="form-group">
            <label>Furnace No</label>
            <select id="entryFurnace">
              <option value="SQF-1">SQF-1</option>
              <option value="SQF-2">SQF-2</option>
              <option value="SQF-3">SQF-3</option>
              <option value="SQF-4">SQF-4</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Part Number / Name</label>
          <input type="text" id="entryPart" placeholder="e.g. 33003" required>
        </div>

        <div class="row-2">
          <div class="form-group">
            <label>Target Qty</label>
            <input type="number" id="entryTarget" placeholder="0" required>
          </div>
          <div class="form-group">
            <label>Produced Qty</label>
            <input type="number" id="entryProduced" placeholder="0" required>
          </div>
        </div>

        <div class="row-2">
          <div class="form-group">
            <label>Rejection Qty</label>
            <input type="number" id="entryReject" placeholder="0">
          </div>
          <div class="form-group">
            <label>Downtime (Mins)</label>
            <input type="number" id="entryDown" placeholder="0">
          </div>
        </div>

        <div class="form-group">
          <label>Remarks / Reason</label>
          <textarea id="entryRemarks" rows="2" placeholder="Reason for rejection or downtime..."></textarea>
        </div>

        <button class="submit-btn" onclick="submitDwmData()">💾 Submit to Sheet</button>
      </div>
    </div>
  </div>

  <script>
    // Dummy Data to show layout (Later this will come from Google Sheets)
    let prodLogs = [
      { date: "2026-08-25", furnace: "SQF-1", part: "33003", target: 500, produced: 490, reject: 5, down: 0, remarks: "Normal Run" },
      { date: "2026-08-25", furnace: "SQF-2", part: "2105", target: 400, produced: 350, reject: 10, down: 45, remarks: "Oil Temp High" },
      { date: "2026-08-24", furnace: "SQF-3", part: "3001", target: 600, produced: 600, reject: 0, down: 0, remarks: "OK" }
    ];

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      let html = "";
      
      let tTarget = 0, tProduced = 0, tReject = 0, tDown = 0;

      prodLogs.forEach(row => {
        tTarget += Number(row.target);
        tProduced += Number(row.produced);
        tReject += Number(row.reject);
        tDown += Number(row.down);

        html += `
          <tr>
            <td style="color: #38bdf8; font-weight: 600;">${row.date}</td>
            <td><span class="sqf-badge">${row.furnace}</span></td>
            <td style="color: #f8fafc; font-weight: 600;">${row.part}</td>
            <td>${row.target}</td>
            <td style="color: #34d399; font-weight: 600;">${row.produced}</td>
            <td style="color: ${row.reject > 0 ? '#ef4444' : '#94a3b8'};">${row.reject}</td>
            <td style="color: ${row.down > 0 ? '#fde047' : '#94a3b8'};">${row.down}</td>
            <td style="font-size: 10.5px;">${row.remarks || '-'}</td>
          </tr>
        `;
      });

      tbody.innerHTML = html;

      // Update KPIs
      document.getElementById('kpiTarget').innerText = `${tTarget} Pcs`;
      document.getElementById('kpiProduced').innerText = `${tProduced} Pcs`;
      document.getElementById('kpiRejection').innerText = `${tReject} Pcs`;
      document.getElementById('kpiDowntime').innerText = `${tDown} Mins`;
    }

    // Modal Controls
    function openDwmModal() {
      document.getElementById('entryDate').valueAsDate = new Date();
      document.getElementById('dwmModal').style.display = 'flex';
    }
    function closeDwmModal() {
      document.getElementById('dwmModal').style.display = 'none';
    }

    // Dummy Submit Function
    function submitDwmData() {
      const date = document.getElementById('entryDate').value;
      const furnace = document.getElementById('entryFurnace').value;
      const part = document.getElementById('entryPart').value;
      const target = document.getElementById('entryTarget').value || 0;
      const produced = document.getElementById('entryProduced').value || 0;
      const reject = document.getElementById('entryReject').value || 0;
      const down = document.getElementById('entryDown').value || 0;
      const remarks = document.getElementById('entryRemarks').value;

      if(!part || !target || !produced) {
        alert("Please fill Part No, Target, and Produced Qty!");
        return;
      }

      // Add to UI Dummy Array
      prodLogs.unshift({
        date: date, furnace: furnace, part: part, 
        target: target, produced: produced, reject: reject, 
        down: down, remarks: remarks
      });

      renderTable();
      closeDwmModal();
      
      // Clear inputs
      document.getElementById('entryPart').value = '';
      document.getElementById('entryTarget').value = '';
      document.getElementById('entryProduced').value = '';
      document.getElementById('entryReject').value = '';
      document.getElementById('entryDown').value = '';
      document.getElementById('entryRemarks').value = '';

      alert("Data Saved Locally! (Linking to Google Sheet next...)");
    }

    // Load initial data
    window.onload = renderTable;
  </script>
</body>
</html>
