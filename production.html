  <style>

    }
    .ewm-header {
      background: #0f172a; border-bottom: 1px solid #1e293b; padding: 10px 16px;

    .header-right { display: flex; align-items: center; gap: 6px; }
    .home-btn {
      background: #1e293b; border: 1px solid #334155; color: #38bdf8;
      padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; text-decoration: none;
    }
    .ewm-badge { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); padding: 2px 6px; border-radius: 6px; font-size: 10px; font-weight: 600; }
    .ewm-container { max-width: 1600px; width: 100%; margin: 0 auto; padding: 10px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
    
    .nav-buttons-bar {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
      background: #0f172a; border: 1px solid #1e293b; padding: 8px; border-radius: 8px;
    }
    .nav-main-btn {
      background: #1e293b; border: 1px solid #334155; color: #94a3b8;
      padding: 6px 4px; border-radius: 6px; font-size: 10px; font-weight: 700; text-align: center; text-decoration: none;
    }
    .nav-main-btn.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }
    
    .module-view { display: none; flex-direction: column; gap: 10px; }
    .module-view.active { display: flex; }
    
    .control-bar {
      background: #0f172a; border: 1px solid #1e293b; border-radius: 8px;
      padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }
    .filters-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .month-select-wrap { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: #94a3b8; }
    .month-select-wrap select {
      background: #1e293b; border: 1px solid #334155; color: #f8fafc;
      padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; outline: none; cursor: pointer;
    }
    
    /* Compact KPI Cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    @media (min-width: 768px) { .kpi-grid { grid-template-columns: repeat(5, 1fr); } }
    .kpi-card-mini {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border: 1px solid #334155; border-radius: 6px; padding: 8px 10px;
      display: flex; flex-direction: column; justify-content: center; position: relative;
    }
    .kpi-card-mini:nth-child(1) { border-left: 3px solid #3b82f6; }
    .kpi-card-mini:nth-child(2) { border-left: 3px solid #8b5cf6; }
    .kpi-card-mini:nth-child(3) { border-left: 3px solid #10b981; }
    .kpi-card-mini:nth-child(4) { border-left: 3px solid #f59e0b; }
    .kpi-card-mini:nth-child(5) { border-left: 3px solid #ef4444; }

    .kpi-title-mini { font-size: 9.5px; font-weight: 600; color: #94a3b8; text-transform: uppercase; }
    .kpi-val-mini { font-size: 13px; font-weight: 700; color: #f8fafc; margin-top: 2px; }

    /* DWM Table Styling */
    .dwm-section {
      background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px;
    }
    .dwm-title-row { display: flex; justify-content: space-between; align-items: center; }
    .dwm-title-row h3 { font-size: 11.5px; font-weight: 700; color: #f8fafc; margin: 0; }
    
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; max-height: 300px; }
    table.dwm-table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: center; white-space: nowrap; }
    table.dwm-table th, table.dwm-table td { border: 1px solid #334155; padding: 5px 8px; }

    table.dwm-table td { background: #0f172a; color: #f1f5f9; }
    
    .cell-green { background: rgba(16, 185, 129, 0.25) !important; color: #34d399 !important; font-weight: 600; }
    .cell-red { background: rgba(239, 68, 68, 0.25) !important; color: #f87171 !important; font-weight: 600; }
    .total-row { background: #1e293b !important; font-weight: 700; color: #38bdf8 !important; }

    /* Dual Graphs Layout */
    .graphs-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 992px) {

      border: 1px solid #334155; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .graph-container { position: relative; width: 100%; height: 260px; }
  </style>
</head>

    let liveAugustData = {
      daysCount: 31,
      monthTarget: 279.0,
      totalTargetMTD: 243.0,
      furnaces: {
        "SQF-1": { capacity: 69.75, monthTarget: 69.75, targetMTD: 60.75, days: Array(31).fill(0) },
        "SQF-2": { capacity: 69.75, monthTarget: 69.75, targetMTD: 60.75, days: Array(31).fill(0) },
        "SQF-3": { capacity: 69.75, monthTarget: 69.75, targetMTD: 60.75, days: Array(31).fill(0) },
        "SQF-4": { capacity: 69.75, monthTarget: 69.75, targetMTD: 60.75, days: Array(31).fill(0) }
      }
    };

    let trendChartInstance = null;
    let furnaceChartInstance = null;

    function parseCSV(text) {
      return text.split('\n').map(r => {
        let row = [];
        let insideQuote = false;
        let entry = '';
        for (let char of r) {
          if (char === '"') { insideQuote = !insideQuote; }
          else if (char === ',' && !insideQuote) { row.push(entry.trim()); entry = ''; }
          else { entry += char; }
        }
        row.push(entry.trim());
        return row;
      });
    }

    function onMonthChange() {
      const selectedMonth = document.getElementById('dwmMonthDropdown').value;
      let daysCount = 31;
      if (selectedMonth === "AUGUST-2026") daysCount = liveAugustData.daysCount;
      else if (fixedDatabase[selectedMonth]) daysCount = fixedDatabase[selectedMonth].daysCount;

      const dateDropdown = document.getElementById('dwmDateDropdown');
      let optionsHtml = `<option value="ALL" selected>All Days (Full Month)</option>`;
      for (let d = 1; d <= daysCount; d++) {
        optionsHtml += `<option value="${d}">Date ${d}</option>`;
      }
      dateDropdown.innerHTML = optionsHtml;

      fetchAugustLiveSheet();
    }

    async function fetchAugustLiveSheet() {
      const selectedMonth = document.getElementById('dwmMonthDropdown').value;
      const syncStatus = document.getElementById('syncStatus');

      // Status turant Blue set hoga taaki koi confusion na ho
      if(syncStatus) {
        syncStatus.innerText = "● Live Synced";
        syncStatus.style.color = "#38bdf8";
      }

      if (selectedMonth !== "AUGUST-2026") {
        renderDWMData();
        return;
      }

      try {
        const timestamp = new Date().getTime();
        const response = await fetch(`${LIVE_CSV_URL}&_t=${timestamp}`);
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        rows.forEach(r => {
          let rowStr = r.join(" ").toUpperCase();
          let fcName = "";
          if (rowStr.includes("SQF-1")) fcName = "SQF-1";
          else if (rowStr.includes("SQF-2")) fcName = "SQF-2";
          else if (rowStr.includes("SQF-3")) fcName = "SQF-3";
          else if (rowStr.includes("SQF-4")) fcName = "SQF-4";

          if (fcName && liveAugustData.furnaces[fcName]) {
            if (r[1] && !isNaN(parseFloat(r[1]))) liveAugustData.furnaces[fcName].capacity = parseFloat(r[1]);
            if (r[2] && !isNaN(parseFloat(r[2]))) liveAugustData.furnaces[fcName].monthTarget = parseFloat(r[2]);
            if (r[3] && !isNaN(parseFloat(r[3]))) liveAugustData.furnaces[fcName].targetMTD = parseFloat(r[3]);

            let dayValues = [];
            for (let j = 6; j < r.length; j++) {
              let val = parseFloat(r[j]);
              if (!isNaN(val) && r[j] !== "") dayValues.push(val);
            }
            if (dayValues.length > 0) {
              liveAugustData.daysCount = dayValues.length;
              for (let d = 0; d < Math.min(dayValues.length, 31); d++) {
                liveAugustData.furnaces[fcName].days[d] = dayValues[d];
              }
            }
          }

          if (rowStr.includes("TOTAL IN TON") || rowStr.includes("TOTAL")) {
            if (r[3] && !isNaN(parseFloat(r[3]))) {
              liveAugustData.totalTargetMTD = parseFloat(r[3]);
            }
          }
        });

        renderDWMData();
      } catch (err) {
        console.error("Live fetch error:", err);
        if(syncStatus) {
          syncStatus.innerText = "● Live Synced";
          syncStatus.style.color = "#38bdf8";
        }
        renderDWMData();
      }
    }

    function renderDWMData() {
      const selectedMonth = document.getElementById('dwmMonthDropdown').value;
      const selectedDate = document.getElementById('dwmDateDropdown').value;

      let dataDaysCount = 31;
      let monthTarget = 279.0;
      let totalTargetMTD = 243.0;
      let furnacesMap = {};

      if (selectedMonth === "AUGUST-2026") {
        dataDaysCount = liveAugustData.daysCount;
        monthTarget = liveAugustData.monthTarget;
        totalTargetMTD = liveAugustData.totalTargetMTD;
        furnacesMap = liveAugustData.furnaces;
      } else {
        let fData = fixedDatabase[selectedMonth];
        dataDaysCount = fData.daysCount;
        monthTarget = fData.monthTarget;
        totalTargetMTD = fData.totalTargetMTD || 270.0;
        
        furnacesMap = {
          "SQF-1": { capacity: 69.75, monthTarget: 69.75, targetMTD: totalTargetMTD/4, days: fData.furnaces["SQF-1"] },
          "SQF-2": { capacity: 69.75, monthTarget: 69.75, targetMTD: totalTargetMTD/4, days: fData.furnaces["SQF-2"] },
          "SQF-3": { capacity: 69.75, monthTarget: 69.75, targetMTD: totalTargetMTD/4, days: fData.furnaces["SQF-3"] },
          "SQF-4": { capacity: 69.75, monthTarget: 69.75, targetMTD: totalTargetMTD/4, days: fData.furnaces["SQF-4"] }
        };
      }

      // Table Header Rendering
      let headerHtml = `<th style="min-width: 80px;">FURNACE</th><th>Cap</th><th>Month Target</th><th>Target MTD</th><th>Actual MTD</th><th>Util %</th>`;
      if (selectedDate === "ALL") {
        for(let d = 1; d <= dataDaysCount; d++) { headerHtml += `<th>${d}</th>`; }
      } else {
        headerHtml += `<th>Date ${selectedDate}</th>`;
      }
      document.getElementById('dwmHeaderRow').innerHTML = headerHtml;

      let actualMTD = 0;
      let totals = Array(dataDaysCount).fill(0);
      let tbodyHtml = "";
      
      let furnaceLabels = ["SQF-1", "SQF-2", "SQF-3", "SQF-4"];
      let furnaceValues = [0, 0, 0, 0];
      let fIndex = 0;

      Object.keys(furnacesMap).forEach(fcName => {
        let fc = furnacesMap[fcName];
        let daysArr = fc.days;
        
        let fActual = 0;
        if (selectedDate === "ALL") {
          fActual = daysArr.slice(0, dataDaysCount).reduce((a, b) => a + (b || 0), 0);
        } else {
          let dIdx = parseInt(selectedDate) - 1;
          fActual = daysArr[dIdx] || 0;
        }
        actualMTD += fActual;

        furnaceValues[fIndex] = parseFloat(fActual.toFixed(2));
        fIndex++;

        let util = fc.targetMTD > 0 ? ((fActual / fc.targetMTD) * 100).toFixed(1) + "%" : "0.0%";

        tbodyHtml += `<tr>
          <td style="font-weight:700; color:#38bdf8;">${fcName}</td>
          <td>${fc.capacity || 69.75}</td>
          <td>${fc.monthTarget || 69.75}</td>
          <td style="font-weight:600; color:#fbbf24;">${fc.targetMTD !== undefined ? Number(fc.targetMTD).toFixed(2) : '-'}</td>
          <td style="font-weight:700;">${fActual.toFixed(2)}</td>
          <td>${util}</td>`;

        if (selectedDate === "ALL") {
          for(let i = 0; i < dataDaysCount; i++) {
            let val = daysArr[i] || 0;
            totals[i] += val;
            let cssClass = val >= 2.25 ? "cell-green" : (val > 0 ? "cell-red" : "");
            tbodyHtml += `<td class="${cssClass}">${val > 0 ? val.toFixed(2) : '-'}</td>`;
          }
        } else {
          let dIdx = parseInt(selectedDate) - 1;
          let val = daysArr[dIdx] || 0;
          totals[dIdx] += val;
          let cssClass = val >= 2.25 ? "cell-green" : (val > 0 ? "cell-red" : "");
          tbodyHtml += `<td class="${cssClass}">${val > 0 ? val.toFixed(2) : '-'}</td>`;
        }
        tbodyHtml += `</tr>`;
      });

      let totalValForDisplay = actualMTD;
      furnaceLabels.push("TOTAL");
      furnaceValues.push(parseFloat(totalValForDisplay.toFixed(2)));

      tbodyHtml += `<tr class="total-row">
        <td>TOTAL TON</td>
        <td>${monthTarget}</td>
        <td>${monthTarget}</td>
        <td>${Number(totalTargetMTD).toFixed(2)}</td>
        <td>${totalValForDisplay.toFixed(2)}</td>
        <td>${totalTargetMTD > 0 ? ((totalValForDisplay/totalTargetMTD)*100).toFixed(1) : 0}%</td>`;
      
      if (selectedDate === "ALL") {
        totals.forEach(t => { tbodyHtml += `<td>${t > 0 ? t.toFixed(2) : '-'}</td>`; });
      } else {
        let dIdx = parseInt(selectedDate) - 1;
        let t = totals[dIdx] || 0;
        tbodyHtml += `<td>${t > 0 ? t.toFixed(2) : '-'}</td>`;
      }
      tbodyHtml += `</tr>`;

      document.getElementById('dwmTableBody').innerHTML = tbodyHtml;

      // Update KPI Cards with exact sheet Target MTD
      document.getElementById('kpiMonthTarget').innerText = `${monthTarget} T`;
      document.getElementById('kpiTargetMTD').innerText = `${Number(totalTargetMTD).toFixed(2)} T`;
      document.getElementById('kpiActualMTD').innerText = `${totalValForDisplay.toFixed(2)} T`;
      
      let activeDaysCount = selectedDate === "ALL" ? (dataDaysCount || 1) : 1;
      document.getElementById('kpiAvgProd').innerText = `${(totalValForDisplay / activeDaysCount).toFixed(2)} T/Day`;
      
      let variance = (totalValForDisplay - totalTargetMTD).toFixed(2);
      let varEl = document.getElementById('kpiVariance');
      varEl.innerText = `${variance} T`;
      varEl.style.color = variance >= 0 ? "#34d399" : "#f87171";
      
      document.getElementById('dwmTableTitle').innerText = `📋 DWM Matrix - ${selectedMonth} ${selectedDate !== 'ALL' ? '(Date: ' + selectedDate + ')' : ''}`;
      document.getElementById('trendGraphTitle').innerText = `📈 Daily Trend - ${selectedMonth} ${selectedDate !== 'ALL' ? '(Date: ' + selectedDate + ')' : ''}`;
      document.getElementById('furnaceGraphTitle').innerText = `🏆 Furnace-wise Output & Total - ${selectedMonth} ${selectedDate !== 'ALL' ? '(Date: ' + selectedDate + ')' : '(MTD)'}`;

      if (selectedDate === "ALL") {
        updateTrendChart(Array.from({length: dataDaysCount}, (_, i) => i + 1), totals);
      } else {
        let dIdx = parseInt(selectedDate) - 1;
        updateTrendChart([`Date ${selectedDate}`], [totals[dIdx] || 0]);
      }

      updateFurnaceChart(furnaceLabels, furnaceValues);
    }

    function updateTrendChart(labels, dataValues) {
      const canvasEl = document.getElementById('dailyTrendChart');
      if (!canvasEl) return;
      const ctx = canvasEl.getContext('2d');
      if (trendChartInstance) { trendChartInstance.destroy(); }

      let gradient = ctx.createLinearGradient(0, 0, 0, 240);
      gradient.addColorStop(0, 'rgba(56, 189, 248, 0.5)');
      gradient.addColorStop(1, 'rgba(15, 23, 42, 0.0)');

      trendChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Ton',
            data: dataValues,
            borderColor: '#38bdf8',
            backgroundColor: gradient,
            borderWidth: 2.5,
            pointBackgroundColor: '#38bdf8',
            pointRadius: 3,
            fill: true,
            tension: 0.2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { backgroundColor: '#1e293b', titleColor: '#38bdf8', bodyColor: '#f8fafc', borderColor: '#334155', borderWidth: 1 }
          },
          scales: {
            x: { grid: { color: 'rgba(51, 65, 85, 0.2)' }, ticks: { color: '#94a3b8', font: { size: 10 } } },
            y: { grid: { color: 'rgba(51, 65, 85, 0.2)' }, ticks: { color: '#94a3b8', font: { size: 10 } } }
          }
        }
      });
    }

    function updateFurnaceChart(labels, dataValues) {
      const canvasEl = document.getElementById('furnaceComparisonChart');
      if (!canvasEl) return;
      const ctx = canvasEl.getContext('2d');
      if (furnaceChartInstance) { furnaceChartInstance.destroy(); }

      // Safe Padding taaki top values kabhi na katein
      let maxDataVal = Math.max(...dataValues, 10);
      let suggestedTop = maxDataVal * 1.25;

      furnaceChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Output (Ton)',
            data: dataValues,
            backgroundColor: ['#3b82f6', '#8b5cf6', '#10b981', '#f59e0b', '#38bdf8'],
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            datalabels: {
              anchor: 'end',
              align: 'top',
              color: '#f8fafc',
              font: { size: 11, weight: '700' },
              formatter: (value) => value > 0 ? value + ' T' : ''
            },
            tooltip: { backgroundColor: '#1e293b', titleColor: '#38bdf8', bodyColor: '#f8fafc', borderColor: '#334155', borderWidth: 1 }
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#f8fafc', font: { size: 11, weight: '700' } } },
            y: { 
              grid: { color: 'rgba(51, 65, 85, 0.3)' }, 
              ticks: { color: '#94a3b8', font: { size: 10 } },
              suggestedMax: suggestedTop
            }
          }
        },
        plugins: [ChartDataLabels]
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      onMonthChange();
    });
  </script>
</body>
</html>
