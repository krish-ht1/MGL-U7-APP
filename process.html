<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milestone Gear - Process Data Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
    body { background: #0f172a; color: #e2e8f0; font-family: 'Poppins', sans-serif; margin: 0; padding: 20px; box-sizing: border-box; }
    
    .dashboard-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #1e293b; padding: 15px 20px; border-radius: 10px; border: 1px solid #334155; }
    .search-box-container { display: flex; gap: 10px; margin-bottom: 15px; }
    .search-input { flex: 1; padding: 12px 18px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 8px; font-size: 14px; outline: none; }
    .btn-search { padding: 0 25px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-add-data { padding: 0 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
    
    .filter-row { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .fc-chip { background: #1e293b; border: 1px solid #334155; color: white; padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; }
    .fc-chip.active { background: #0284c7; border-color: #0284c7; }
    .dropdown-filter { background: #1e293b; border: 1px solid #334155; color: white; padding: 6px 12px; border-radius: 6px; font-size: 12px; outline: none; }

    .month-section-title { color: #facc15; font-size: 14px; font-weight: 700; margin: 20px 0 8px 0; text-transform: uppercase; }
    .data-table-wrapper { overflow-x: auto; background: #1e293b; border-radius: 10px; border: 1px solid #334155; margin-bottom: 15px; }
    .data-table { width: 100%; border-collapse: collapse; white-space: nowrap; text-align: left; font-size: 11.5px; }
    .data-table th { background: #0284c7; color: white; padding: 10px 12px; border-right: 1px solid #0369a1; }
    .data-table td { padding: 9px 12px; border-bottom: 1px solid #334155; border-right: 1px solid #334155; color: #cbd5e1; }

    /* मॉडल्स */
    .custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; }
    .modal-content-box { background: #1e293b; width: 95%; max-width: 700px; max-height: 90vh; border-radius: 12px; color: white; display: flex; flex-direction: column; border: 1px solid #475569; overflow: hidden; position: relative; }
    .modal-header { padding: 15px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { font-size: 11px; color: #94a3b8; display: block; margin-bottom: 3px; }
    .form-group input, .form-group select { width: 100%; padding: 8px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; font-size: 12px; }
  </style>
</head>
<body>

  <div class="dashboard-header-bar">
    <div>
      <h2 style="color: #38bdf8; margin: 0; font-size: 18px;">📊 Process Data & Quality Dashboard</h2>
      <p style="margin: 3px 0 0 0; font-size: 11px; color: #94a3b8;">Linked with Master Sheet ('process' tab)</p>
    </div>
    <div style="display: flex; gap: 10px;">
      <button onclick="openAddDataModal()" class="btn-add-data">+ Add New Entry</button>
      <button onclick="window.location.href='index.html'" style="background: #ef4444; color: white; border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;">Back to Home</button>
    </div>
  </div>

  <div class="search-box-container">
    <input type="text" id="mainSearch" class="search-input" placeholder="Search by Batch Code, Part No, or MS Number..." onkeyup="filterDashboard()">
    <button class="btn-search" onclick="filterDashboard()">Search</button>
  </div>

  <div class="filter-row">
    <div class="filter-group">
      <button class="fc-chip active" onclick="setFC('All', this)">All</button>
      <button class="fc-chip" onclick="setFC('SQF-1', this)">SQF-1</button>
      <button class="fc-chip" onclick="setFC('SQF-2', this)">SQF-2</button>
      <button class="fc-chip" onclick="setFC('SQF-3', this)">SQF-3</button>
      <button class="fc-chip" onclick="setFC('SQF-4', this)">SQF-4</button>
    </div>
    <select id="customerFilter" class="dropdown-filter" onchange="filterDashboard()">
      <option value="Sab">Customer: All</option>
      <option value="JCB UK">JCB UK</option>
      <option value="Caterpillar">Caterpillar</option>
      <option value="Kubota">Kubota</option>
    </select>
  </div>

  <!-- महीना-वाइज टेबल्स कंटेनर -->
  <div id="monthTablesContainer">
    <p style="text-align: center; color: #94a3b8; padding: 30px;">Loading data from Google Sheet...</p>
  </div>

  <!-- + Add 21 Columns Data Modal -->
  <div id="addDataModal" class="custom-modal">
    <div class="modal-content-box">
      <div class="modal-header">
        <h3 style="color: #10b981; margin: 0; font-size: 15px;">📝 Add Process Data (21 Columns Entry)</h3>
        <span onclick="closeAddDataModal()" style="font-size: 22px; cursor: pointer; color: #94a3b8;">&times;</span>
      </div>
      <div class="modal-body">
        <form id="processForm" onsubmit="submitFormToSheet(event)">
          <div class="form-grid">
            <div class="form-group"><label>Date</label><input type="date" id="c0" required></div>
            <div class="form-group"><label>Customer Name</label><input type="text" id="c1" required></div>
            <div class="form-group"><label>Part No</label><input type="text" id="c2" required></div>
            <div class="form-group"><label>Batch No</label><input type="text" id="c3" required></div>
            <div class="form-group"><label>Heat Code</label><input type="text" id="c4"></div>
            <div class="form-group"><label>F/C No (SQF-1/2/3/4)</label>
              <select id="c5">
                <option value="SQF-1">SQF-1</option><option value="SQF-2">SQF-2</option><option value="SQF-3">SQF-3</option><option value="SQF-4">SQF-4</option>
              </select>
            </div>
            <div class="form-group"><label>QTY</label><input type="text" id="c6"></div>
            <div class="form-group"><label>S.H</label><input type="text" id="c7"></div>
            <div class="form-group"><label>PCD</label><input type="text" id="c8"></div>
            <div class="form-group"><label>RCD</label><input type="text" id="c9"></div>
            <div class="form-group"><label>CORE</label><input type="text" id="c10"></div>
            <div class="form-group"><label>ECD</label><input type="text" id="c11"></div>
            <div class="form-group"><label>Remark/Retempering</label><input type="text" id="c12"></div>
            <div class="form-group"><label>After Grinding</label><input type="text" id="c13"></div>
            <div class="form-group"><label>Equalise</label><input type="text" id="c14"></div>
            <div class="form-group"><label>Carburising</label><input type="text" id="c15"></div>
            <div class="form-group"><label>Diffusion</label><input type="text" id="c16"></div>
            <div class="form-group"><label>Hardening</label><input type="text" id="c17"></div>
            <div class="form-group"><label>Quenching</label><input type="text" id="c18"></div>
            <div class="form-group"><label>Tempering</label><input type="text" id="c19"></div>
            <div class="form-group" style="grid-column: span 2;"><label>Remarks/Loading/Pasting</label><input type="text" id="c20"></div>
          </div>
          <button type="submit" style="width:100%; background:#10b981; color:white; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:15px;">Save to Google Sheet</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const sheetURL = "https://script.google.com/macros/s/AKfycbyNn7YoW87zJeXyFejqOK122FscGeAKi0b-eTXVgybUtnXR8Ots4YvNxQhzn2uicwo0/exec";
    let masterData = [];
    let selectedFC = "All";

    function setFC(fc, btn) {
      selectedFC = fc;
      document.querySelectorAll('.fc-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      filterDashboard();
    }

    // तारीख को सही YYYY-MM-DD फॉर्मेट में बदलने का फंक्शन
    function formatDate(dateString) {
      if (!dateString) return '-';
      let d = new Date(dateString);
      if (isNaN(d.getTime())) return dateString;
      let year = d.getFullYear();
      let month = String(d.getMonth() + 1).padStart(2, '0');
      let day = String(d.getDate()).padStart(2, '0');
      return `${day}-${month}-${year}`;
    }

    async function fetchProcessRecords() {
      try {
        const res = await fetch(sheetURL);
        const data = await res.json();
        if(data.processData && data.processData.length > 1) {
          let rows = data.processData.slice(1);
          masterData = rows.map(r => ({
            date: formatDate(r[0]), customer: r[1] || '', partNo: r[2] || '', batch: r[3] || '',
            heat: r[4] || '', fc: r[5] || '', qty: r[6] || '', sh: r[7] || '',
            pcd: r[8] || '', rcd: r[9] || '', core: r[10] || '', ecd: r[11] || '',
            remRetemp: r[12] || '', afterGrind: r[13] || '', equalise: r[14] || '',
            carb: r[15] || '', diff: r[16] || '', hard: r[17] || '', quench: r[18] || '',
            temp: r[19] || '', remarks: r[20] || '', raw: r
          }));
          renderDashboard(masterData);
        } else {
          document.getElementById('monthTablesContainer').innerHTML = `<p style="text-align:center; color:#f59e0b; padding:20px;">No records found in 'process' tab.</p>`;
        }
      } catch(e) {
        console.error("Error:", e);
        document.getElementById('monthTablesContainer').innerHTML = `<p style="text-align:center; color:#ef4444; padding:20px;">Failed to load data. Check console.</p>`;
      }
    }
    fetchProcessRecords();

    function filterDashboard() {
      const query = document.getElementById('mainSearch').value.toLowerCase();
      const cust = document.getElementById('customerFilter').value;

      const filtered = masterData.filter(item => {
        const matchesQuery = Object.values(item).some(val => String(val).toLowerCase().includes(query));
        const matchesFC = selectedFC === "All" || item.fc.includes(selectedFC);
        const matchesCust = cust === "Sab" || item.customer === cust;
        return matchesQuery && matchesFC && matchesCust;
      });

      renderDashboard(filtered);
    }

    function renderDashboard(data) {
      const container = document.getElementById('monthTablesContainer');
      container.innerHTML = "";

      if(data.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:#94a3b8; padding:20px;">No matching records found.</p>`;
        return;
      }

      // Recent Data Top पर (Descending Order)
      data.sort((a, b) => new Date(b.date) - new Date(a.date));

      let grouped = {};
      data.forEach(item => {
        let d = new Date(item.date);
        let monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
        let monthKey = isNaN(d.getTime()) ? "OTHER RECORDS" : `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
        if(!grouped[monthKey]) grouped[monthKey] = [];
        grouped[monthKey].push(item);
      });

      Object.keys(grouped).forEach(monthKey => {
        let rows = grouped[monthKey];
        let html = `
          <div class="month-section-title">📅 ${monthKey} (${rows.length} entries)</div>
          <div class="data-table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>DATE</th><th>CUSTOMER</th><th>PART NO</th><th>BATCH NO</th><th>HEAT CODE</th><th>F/C NO</th>
                  <th>QTY</th><th>S.H</th><th>PCD</th><th>RCD</th><th>CORE</th><th>ECD</th>
                  <th>REMARK/RETEMP</th><th>AFTER GRIND</th><th>EQUALISE</th><th>CARBURISING</th>
                  <th>DIFFUSION</th><th>HARDENING</th><th>QUENCHING</th><th>TEMPERING</th><th>REMARKS/LOADING</th>
                </tr>
              </thead>
              <tbody>
        `;

        rows.forEach(r => {
          html += `
            <tr>
              <td>${r.date}</td><td>${r.customer}</td><td>${r.partNo}</td><td>${r.batch}</td><td>${r.heat}</td><td>${r.fc}</td>
              <td>${r.qty}</td><td>${r.sh}</td><td>${r.pcd}</td><td>${r.rcd}</td><td>${r.core}</td><td>${r.ecd}</td>
              <td>${r.remRetemp}</td><td>${r.afterGrind}</td><td>${r.equalise}</td><td>${r.carb}</td>
              <td>${r.diff}</td><td>${r.hard}</td><td>${r.quench}</td><td>${r.temp}</td><td>${r.remarks}</td>
            </tr>
          `;
        });

        html += `</tbody></table></div>`;
        container.innerHTML += html;
      });
    }

    function openAddDataModal() { document.getElementById('addDataModal').style.display = 'flex'; }
    function closeAddDataModal() { document.getElementById('addDataModal').style.display = 'none'; }

    async function submitFormToSheet(e) {
      e.preventDefault();
      let payload = {
        date: document.getElementById('c0').value, customer: document.getElementById('c1').value,
        partNo: document.getElementById('c2').value, batch: document.getElementById('c3').value,
        heat: document.getElementById('c4').value, fc: document.getElementById('c5').value,
        qty: document.getElementById('c6').value, sh: document.getElementById('c7').value,
        pcd: document.getElementById('c8').value, rcd: document.getElementById('c9').value,
        core: document.getElementById('c10').value, ecd: document.getElementById('c11').value,
        remarkRetemper: document.getElementById('c12').value, afterGrind: document.getElementById('c13').value,
        equalise: document.getElementById('c14').value, carburising: document.getElementById('c15').value,
        diffusion: document.getElementById('c16').value, hardening: document.getElementById('c17').value,
        quenching: document.getElementById('c18').value, tempering: document.getElementById('c19').value,
        remarksLoading: document.getElementById('c20').value
      };

      alert("Submitting data to Google Sheet...");
      try {
        await fetch(sheetURL, { method: 'POST', body: JSON.stringify(payload) });
        alert("Data successfully added to Google Sheet!");
        closeAddDataModal();
        fetchProcessRecords();
      } catch(err) {
        alert("Failed to submit data.");
      }
    }
  </script>
</body>
</html>
