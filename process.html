<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heat Treatment Unit 7 - Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #090d16; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .phone-frame { width: 410px; height: 840px; background: #0f172a; border: 10px solid #1e293b; border-radius: 36px; box-shadow: 0 20px 45px rgba(0,0,0,0.7); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        @media (min-width: 768px) {
            .phone-frame { width: min(650px, 92vw); height: min(900px, 95vh); border-width: 4px; border-radius: 20px; }
        }

        /* TOP HEADER */
        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 14px 12px 14px; background: #1e293b; border-bottom: 2px solid #334155; }
        .header-logo { width: 50px; height: 50px; background: #38bdf8; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 900; color: #0f172a; font-size: 16px; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        .header-text { text-align: right; }
        .main-title { font-size: 14px; font-weight: 900; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; }
        .sub-title { font-size: 10px; font-weight: bold; color: #94a3b8; text-transform: uppercase; }
        .real-time { font-size: 10px; color: #eab308; font-weight: bold; margin-top: 4px; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; display: inline-block; }

        .app-body { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; scrollbar-width: thin; scrollbar-color: #334155 #0f172a; }
        
        /* NAVIGATION / TOP CONTROLS */
        .search-container { display: flex; gap: 6px; margin-bottom: 8px; }
        .search-box { flex: 1; padding: 8px 10px; background-color: #1e293b; border: 1px solid #334155; border-radius: 6px; color: white; font-size: 11px; outline: none; }
        .btn-search { background-color: #38bdf8; color: #0f172a; border: none; padding: 0 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; }

        .filters-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
        .filter-select { background: #1e293b; border: 1px solid #334155; color: #f8fafc; padding: 6px; border-radius: 6px; font-size: 10px; outline: none; width: 100%; }
        .fc-row { display: flex; gap: 4px; grid-column: span 2; }
        .fc-btn { flex: 1; background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 6px 2px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .fc-btn.active { background: #0284c7; color: white; border-color: #38bdf8; }

        /* SUMMARY & CARDS */
        .green-ribbon { background: linear-gradient(135deg, #16a34a, #15803d); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #22c55e; }
        .ribbon-title { font-size: 11px; font-weight: 900; text-transform: uppercase; color: #dcfce7; }
        .ribbon-sub { font-size: 10px; color: #f0fdf4; margin-top: 2px; }
        .ribbon-stat { text-align: right; }
        .weight-val { font-size: 15px; font-weight: 900; color: #86efac; }
        .weight-label { font-size: 8px; color: #dcfce7; font-weight: bold; text-transform: uppercase; }

        .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; }
        .summary-box { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 6px 2px; text-align: center; }
        .summary-val { font-size: 12px; font-weight: bold; color: #38bdf8; }
        .summary-label { font-size: 8px; color: #94a3b8; text-transform: uppercase; }

        /* MONTH-WISE TABLE CONTAINERS */
        .month-section { margin-bottom: 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; overflow: hidden; }
        .month-header { background: #1e293b; color: #eab308; font-size: 11px; font-weight: bold; padding: 8px 10px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; }
        .table-wrapper { overflow-x: auto; max-height: 260px; scrollbar-width: thin; scrollbar-color: #475569 #0f172a; }
        
        table { width: 2200px; border-collapse: collapse; font-size: 9.5px; text-align: left; }
        th { padding: 6px 8px; font-weight: bold; text-transform: uppercase; white-space: nowrap; position: sticky; top: 0; z-index: 2; }
        .th-cyan { background: #0891b2; color: #ffffff; }
        .th-yellow { background: #ca8a04; color: #ffffff; }
        td { padding: 6px 8px; border-bottom: 1px solid #1e293b; white-space: nowrap; color: #e2e8f0; background: #0b1120; }
        tr:nth-child(even) td { background: #0f172a; }
        
        /* FOOTER */
        .app-footer { background: #0f172a; text-align: center; padding: 10px; font-size: 10px; font-weight: bold; color: #64748b; border-top: 1px solid #1e293b; }
        .app-footer span { color: #38bdf8; }
    </style>
</head>
<body>

<div class="phone-frame">
    <!-- HEADER -->
    <div class="top-header">
        <div class="header-logo">MGL</div>
        <div class="header-text">
            <div class="main-title">MILESTONE GEAR LIMITED</div>
            <div class="sub-title">Heat Treatment Unit 7</div>
            <div class="real-time" id="clockDisplay">--:--:--</div>
        </div>
    </div>

    <div class="app-body">
        <!-- SEARCH -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="Search Part No, Batch or Heat Code..." oninput="filterData()">
            <button class="btn-search" onclick="filterData()">Search</button>
        </div>

        <!-- FILTERS -->
        <div class="filters-grid">
            <div class="fc-row">
                <button class="fc-btn active" data-fc="ALL" onclick="setFC(this, 'ALL')">ALL F/C</button>
                <button class="fc-btn" data-fc="1.0" onclick="setFC(this, '1.0')">F/C 1</button>
                <button class="fc-btn" data-fc="2.0" onclick="setFC(this, '2.0')">F/C 2</button>
                <button class="fc-btn" data-fc="3.0" onclick="setFC(this, '3.0')">F/C 3</button>
                <button class="fc-btn" data-fc="4.0" onclick="setFC(this, '4.0')">F/C 4</button>
            </div>
            <select class="filter-select" id="monthFilter" onchange="filterData()">
                <option value="">Month: All</option>
                <option value="Jan">Jan</option><option value="Feb">Feb</option><option value="Mar">Mar</option>
                <option value="Apr">Apr</option><option value="May">May</option><option value="Jun">Jun</option>
                <option value="Jul">Jul</option><option value="Aug">Aug</option><option value="Sep">Sep</option>
                <option value="Oct">Oct</option><option value="Nov">Nov</option><option value="Dec">Dec</option>
            </select>
            <select class="filter-select" id="custFilter" onchange="filterData()">
                <option value="">Customer: All</option>
            </select>
        </div>

        <!-- SUMMARY STATS -->
        <div class="green-ribbon">
            <div>
                <div class="ribbon-title" id="ribbonTitle">Live Process Dashboard</div>
                <div class="ribbon-sub" id="ribbonSub">Total Process Qty: 0 pcs</div>
            </div>
            <div class="ribbon-stat">
                <div class="weight-val" id="totalBatches">0</div>
                <div class="weight-label">Batches</div>
            </div>
        </div>

        <div class="summary-grid">
            <div class="summary-box"><div class="summary-val" id="sumRecords">0</div><div class="summary-label">Total Rows</div></div>
            <div class="summary-box"><div class="summary-val" id="sumMonths">0</div><div class="summary-label">Months</div></div>
            <div class="summary-box"><div class="summary-val" id="sumCust">0</div><div class="summary-label">Customers</div></div>
            <div class="summary-box"><div class="summary-val" id="sumParts">0</div><div class="summary-label">Part Nos</div></div>
        </div>

        <!-- DYNAMIC MONTH SECTIONS GO HERE -->
        <div id="monthSectionsContainer"></div>
    </div>

    <!-- FOOTER -->
    <div class="app-footer">
        MGL Unit 7 &bull; <span>Process Data Engine</span> &bull; 2026
    </div>
</div>

<script>
    // ⏰ Live Clock
    function updateClock() {
        const now = new Date();
        document.getElementById('clockDisplay').innerText = now.toLocaleString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 🗄️ Embedded Dataset (Your Master Data Array Goes Here)
    const masterData = []; // Paste your full dataset or let it load from your source

    let selectedFC = "ALL";

    function setFC(btn, fc) {
        document.querySelectorAll('.fc-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedFC = fc;
        filterData();
    }

    function initCustomerFilter() {
        const custs = new Set();
        masterData.forEach(d => {
            const c = d["CUSTOMER  NAME"] || d["CUSTOMER NAME"];
            if (c && c !== "-" && c !== "NAN") custs.add(c.trim());
        });
        const custDropdown = document.getElementById('custFilter');
        custs.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c;
            opt.innerText = c;
            custDropdown.appendChild(opt);
        });
    }

    function filterData() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const month = document.getElementById('monthFilter').value;
        const cust = document.getElementById('custFilter').value;

        // Sorting recent data on top (Descending by Date)
        const filtered = masterData.filter(row => {
            const rowCust = (row["CUSTOMER  NAME"] || row["CUSTOMER NAME"] || "").toLowerCase();
            const rowPart = (row["PART NO"] || "").toLowerCase();
            const rowBatch = (row["BATCH NO"] || "").toLowerCase();
            const rowHeat = (row["HEAT CODE"] || "").toLowerCase();
            const rowFC = (row["F/C NO"] || "").toString();
            const rowMonth = row["MONTH_NAME"] || "";

            const matchSearch = !search || rowPart.includes(search) || rowBatch.includes(search) || rowHeat.includes(search);
            const matchFC = (selectedFC === "ALL") || (rowFC.startsWith(selectedFC.replace('.0', '')));
            const matchMonth = !month || rowMonth === month;
            const matchCust = !cust || (rowCust === cust.toLowerCase());

            return matchSearch && matchFC && matchMonth && matchCust;
        }).sort((a, b) => new Date(b.DATE) - new Date(a.DATE));

        renderDashboard(filtered);
    }

    function renderDashboard(data) {
        let totalQty = 0;
        const uniqueParts = new Set();
        const uniqueCust = new Set();
        const groupedByMonth = {};

        data.forEach(row => {
            const qty = parseInt(row["QTY."]) || 0;
            totalQty += qty;
            if (row["PART NO"]) uniqueParts.add(row["PART NO"]);
            const c = row["CUSTOMER  NAME"] || row["CUSTOMER NAME"];
            if (c) uniqueCust.add(c);

            const mKey = row["MONTH_YEAR"] || (row["MONTH_NAME"] ? row["MONTH_NAME"] + " 2024" : "Other");
            if (!groupedByMonth[mKey]) groupedByMonth[mKey] = [];
            groupedByMonth[mKey].push(row);
        });

        document.getElementById('ribbonSub').innerText = `Total Process Qty: ${totalQty.toLocaleString()} pcs`;
        document.getElementById('totalBatches').innerText = data.length;
        document.getElementById('sumRecords').innerText = data.length;
        document.getElementById('sumMonths').innerText = Object.keys(groupedByMonth).length;
        document.getElementById('sumCust').innerText = uniqueCust.size;
        document.getElementById('sumParts').innerText = uniqueParts.size;

        const container = document.getElementById('monthSectionsContainer');
        container.innerHTML = "";

        if (data.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding: 20px; color:#64748b; font-size:12px;">No matching records found.</div>`;
            return;
        }

        // Render Month-wise Sections
        Object.keys(groupedByMonth).forEach(mKey => {
            const rows = groupedByMonth[mKey];
            const section = document.createElement('div');
            section.className = 'month-section';

            let tableRows = rows.map(r => `
                <tr>
                    <td>${r["DATE"] || "-"}</td>
                    <td>${r["CUSTOMER  NAME"] || r["CUSTOMER NAME"] || "-"}</td>
                    <td><strong>${r["PART NO"] || "-"}</strong></td>
                    <td>${r["BATCH NO"] || "-"}</td>
                    <td>${r["HEAT CODE"] || "-"}</td>
                    <td>${r["F/C NO"] || "-"}</td>
                    <td><strong>${r["QTY."] || "-"}</strong></td>
                    <td>${r["S.H"] || "-"}</td>
                    <td>${r["PCD"] || "-"}</td>
                    <td>${r["RCD"] || "-"}</td>
                    <td>${r["CORE"] || "-"}</td>
                    <td>${r["ECD"] || "-"}</td>
                    <td>${r["REMARK/RETEMPERING"] || "-"}</td>
                    <td>${r["AFTER GRINDING"] || "-"}</td>
                    <td>${r["EQULISE (TIME*CP)"] || "-"}</td>
                    <td>${r["CARBURISING (TEMP*TIME*CP)"] || "-"}</td>
                    <td>${r["DIFFUSION (TEMP*TIME*CP)"] || "-"}</td>
                    <td>${r["HARDENING (TEMP*TIME*CP)"] || "-"}</td>
                    <td>${r["QUENCHING (RPM*OIL TEMP)"] || "-"}</td>
                    <td>${r["TEMPERING (TEMP*TIME)"] || "-"}</td>
                    <td>${r["REMARKS/LOADING/PASTING"] || "-"}</td>
                </tr>
            `).join('');

            section.innerHTML = `
                <div class="month-header">
                    <span>📅 ${mKey}</span>
                    <span>${rows.length} Entries</span>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th class="th-cyan">DATE</th>
                                <th class="th-cyan">CUSTOMER</th>
                                <th class="th-cyan">PART NO</th>
                                <th class="th-cyan">BATCH NO</th>
                                <th class="th-cyan">HEAT CODE</th>
                                <th class="th-cyan">F/C NO</th>
                                <th class="th-cyan">QTY</th>
                                <th class="th-cyan">S.H</th>
                                <th class="th-cyan">PCD</th>
                                <th class="th-cyan">RCD</th>
                                <th class="th-cyan">CORE</th>
                                <th class="th-cyan">ECD</th>
                                <th class="th-cyan">RETEMPERING</th>
                                <th class="th-cyan">GRINDING</th>
                                <th class="th-yellow">EQUALISE</th>
                                <th class="th-yellow">CARBURISING</th>
                                <th class="th-yellow">DIFFUSION</th>
                                <th class="th-yellow">HARDENING</th>
                                <th class="th-yellow">QUENCHING</th>
                                <th class="th-yellow">TEMPERING</th>
                                <th class="th-yellow">REMARKS</th>
                            </tr>
                        </thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                </div>
            `;
            container.appendChild(section);
        });
    }

    // Initialize
    initCustomerFilter();
    filterData();
</script>
</body>
</html>
