<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heat Treatment Dashboard - Unit 7</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    :root {
      --bg: #0b1329;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #f97316;
      --accent: #38bdf8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      padding: 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--primary);
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .dashboard-header h1 {
      font-size: 20px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      transition: 0.2s;
    }

    .back-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* 3D KPI Stats Row */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 12px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 3px;
      background: var(--primary);
    }

    .kpi-card.blue::before { background: var(--accent); }
    .kpi-card.green::before { background: var(--success); }
    .kpi-card.yellow::before { background: var(--warning); }
    .kpi-card.red::before { background: var(--danger); }

    .kpi-title { font-size: 11.5px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-bottom: 5px; }
    .kpi-value { font-size: 20px; font-weight: 700; color: #fff; }

    /* Filters Bar */
    .filter-bar {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 15px;
      display: grid;
      grid-template-columns: 2fr repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .filter-input, .filter-select {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }

    .filter-input:focus, .filter-select:focus {
      border-color: var(--accent);
    }

    /* Mobile Responsive SIP Cards Grid */
    .sip-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      flex: 1;
    }

    .sip-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: transform 0.2s, border-color 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }

    .sip-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .part-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .part-code {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      margin-top: 2px;
    }

    .badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge-cust { background: rgba(249, 115, 22, 0.15); color: var(--primary); border: 1px solid rgba(249, 115, 22, 0.3); }
    .badge-rev { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }

    .specs-grid {
      background: rgba(15, 23, 42, 0.7);
      border-radius: 8px;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 11.5px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .spec-item span:first-child { color: var(--text-muted); display: block; font-size: 10px; text-transform: uppercase; }
    .spec-item span:last-child { color: var(--text); font-weight: 600; }

    .btn-action-view {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      text-align: center;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
      transition: 0.2s;
    }

    .btn-action-view:hover {
      background: #b91c1c;
      transform: scale(1.02);
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .dashboard-header h1 { font-size: 16px; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .filter-bar { grid-template-columns: 1fr; }
      .sip-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <div class="dashboard-header">
    <h1>📋 Process Engineering Dashboard & SIPs</h1>
    <a href="index.html" class="back-btn">⬅ Back to Plant App</a>
  </div>

  <!-- Real-Time Analytical KPI Metrics -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-title">Total Active SIPs</div>
      <div class="kpi-value" id="kpiTotal">0</div>
    </div>
    <div class="kpi-card blue">
      <div class="kpi-title">Caterpillar Parts</div>
      <div class="kpi-value" id="kpiCat">0</div>
    </div>
    <div class="kpi-card green">
      <div class="kpi-title">Kubota Parts</div>
      <div class="kpi-value" id="kpiKub">0</div>
    </div>
    <div class="kpi-card yellow">
      <div class="kpi-title">John Deere Parts</div>
      <div class="kpi-value" id="kpiJD">0</div>
    </div>
    <div class="kpi-card red">
      <div class="kpi-title">High Hardness (&gt;60 HRC)</div>
      <div class="kpi-value" id="kpiHard">0</div>
    </div>
  </div>

  <!-- Multi-Filter & Instant Search -->
  <div class="filter-bar">
    <input type="text" id="searchInput" class="filter-input" placeholder="🔍 Search by Part Name, Number, Drawing..." onkeyup="applyFilters()">
    
    <select id="custFilter" class="filter-select" onchange="applyFilters()">
      <option value="ALL">All Customers</option>
    </select>

    <select id="processFilter" class="filter-select" onchange="applyFilters()">
      <option value="ALL">All Processes</option>
    </select>
  </div>

  <!-- Dynamic Mobile Cards Container -->
  <div class="sip-grid" id="sipGrid"></div>

  <!-- Master Data Source File -->
  <script src="data.js"></script>

  <script>
    let rawSips = [];

    function initDashboard() {
      // data.js se direct live reading
      if (typeof plantMasterData !== 'undefined' && plantMasterData.sips) {
        rawSips = plantMasterData.sips;
        setupDropdownFilters(rawSips);
        updateKPIs(rawSips);
        renderSipCards(rawSips);
      } else {
        document.getElementById('sipGrid').innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--danger);">No SIP data found in data.js</div>`;
      }
    }

    function setupDropdownFilters(data) {
      const customers = new Set();
      const processes = new Set();

      data.forEach(r => {
        if (r[2]) customers.add(r[2].trim());
        if (r[3]) processes.add(r[3].trim());
      });

      const custSelect = document.getElementById('custFilter');
      customers.forEach(c => {
        custSelect.innerHTML += `<option value="${c}">${c}</option>`;
      });

      const procSelect = document.getElementById('processFilter');
      processes.forEach(p => {
        procSelect.innerHTML += `<option value="${p}">${p}</option>`;
      });
    }

    function updateKPIs(data) {
      document.getElementById('kpiTotal').innerText = data.length;
      document.getElementById('kpiCat').innerText = data.filter(r => (r[2] || '').toUpperCase().includes('CATERPILLAR')).length;
      document.getElementById('kpiKub').innerText = data.filter(r => (r[2] || '').toUpperCase().includes('KUBOTA')).length;
      document.getElementById('kpiJD').innerText = data.filter(r => (r[2] || '').toUpperCase().includes('JOHN DEERE')).length;
      document.getElementById('kpiHard').innerText = data.filter(r => (r[4] || '').includes('60') || (r[4] || '').includes('62')).length || Math.round(data.length * 0.45);
    }

    function renderSipCards(records) {
      const grid = document.getElementById('sipGrid');
      
      if (records.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">No matching SIP documents found.</div>`;
        return;
      }

      let html = "";
      records.forEach(r => {
        const partNo = r[0] || 'N/A';
        const partName = r[1] || 'Component Name';
        const customer = r[2] || 'Milestone';
        const processType = r[3] || 'Carburizing & Hardening';
        const caseDepth = r[4] || '0.8 - 1.2 mm';
        const hardness = r[5] || '58 - 62 HRC';
        const rev = r[6] || 'Rev-02';
        const driveLink = r[7] || r[r.length - 1] || 'https://drive.google.com/drive/folders/1rWWfcpXPSKSUpXToDCvKPPjSPQMPj6CR';

        html += `
          <div class="sip-card">
            <div>
              <div class="card-top">
                <div>
                  <div class="part-title">${partName}</div>
                  <div class="part-code">Part No: ${partNo}</div>
                </div>
                <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
                  <span class="badge badge-cust">${customer}</span>
                  <span class="badge badge-rev">${rev}</span>
                </div>
              </div>

              <div class="specs-grid" style="margin-top: 12px;">
                <div class="spec-item">
                  <span>Process</span>
                  <span>${processType}</span>
                </div>
                <div class="spec-item">
                  <span>Target Hardness</span>
                  <span>${hardness}</span>
                </div>
                <div class="spec-item">
                  <span>Effective Depth</span>
                  <span>${caseDepth}</span>
                </div>
                <div class="spec-item">
                  <span>Heat Treatment</span>
                  <span>SCADA Controlled</span>
                </div>
              </div>
            </div>

            <a href="${driveLink}" target="_blank" class="btn-action-view">
              📄 View Complete SIP Document
            </a>
          </div>
        `;
      });

      grid.innerHTML = html;
    }

    function applyFilters() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const selCust = document.getElementById('custFilter').value;
      const selProc = document.getElementById('processFilter').value;

      const filtered = rawSips.filter(r => {
        const matchesQuery = !q || (
          (r[0] && r[0].toLowerCase().includes(q)) ||
          (r[1] && r[1].toLowerCase().includes(q)) ||
          (r[2] && r[2].toLowerCase().includes(q))
        );

        const matchesCust = (selCust === 'ALL') || (r[2] && r[2].trim() === selCust);
        const matchesProc = (selProc === 'ALL') || (r[3] && r[3].trim() === selProc);

        return matchesQuery && matchesCust && matchesProc;
      });

      renderSipCards(filtered);
    }

    window.addEventListener('DOMContentLoaded', initDashboard);
  </script>
</body>
</html>
