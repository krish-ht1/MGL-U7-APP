<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Process Data & SIPs - Milestone Gear</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      min-height: 100vh;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f97316;
      padding-bottom: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .title-area h2 {
      margin: 0;
      color: #f97316;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-area p {
      margin: 4px 0 0 0;
      font-size: 12px;
      color: #94a3b8;
    }

    .back-btn {
      background: #f97316;
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      transition: 0.2s;
    }

    .back-btn:hover {
      background: #ea580c;
    }

    .search-filter-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 260px;
      padding: 10px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      outline: none;
    }

    .search-input:focus {
      border-color: #38bdf8;
    }

    .record-badge {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 12px;
      color: #38bdf8;
      font-weight: 600;
      display: flex;
      align-items: center;
    }

    .table-container {
      overflow-x: auto;
      background: #1e293b;
      border-radius: 10px;
      border: 1px solid #334155;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 12.5px;
      white-space: nowrap;
    }

    th {
      background: #0284c7;
      color: white;
      padding: 12px 14px;
      font-weight: 600;
      border-right: 1px solid #0369a1;
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid #334155;
      border-right: 1px solid #334155;
    }

    tr:nth-child(even) {
      background: #162032;
    }

    tr:hover {
      background: rgba(56, 189, 248, 0.08);
    }

    .btn-view-pdf {
      background: #ef4444;
      color: white;
      padding: 6px 12px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: 600;
      font-size: 11.5px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: 0.2s;
    }

    .btn-view-pdf:hover {
      background: #dc2626;
      transform: scale(1.03);
    }

    .cust-badge {
      background: rgba(249, 115, 22, 0.15);
      color: #f97316;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="title-area">
      <h2>📋 Process Data & Standard Inspection Procedures (SIPs)</h2>
      <p>Instant Search across all Heat Treatment SIPs & Customer Drawings</p>
    </div>
    <a href="index.html" class="back-btn">⬅ Back to Dashboard</a>
  </div>

  <div class="search-filter-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search by Part No, Part Name, Customer, Drawing No..." onkeyup="filterSips()">
    <div class="record-badge" id="recordCount">Loading records...</div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 50px; text-align: center;">SR</th>
          <th>PART NUMBER</th>
          <th>PART / PROCESS NAME</th>
          <th>CUSTOMER</th>
          <th>DRAWING NO</th>
          <th>REVISION</th>
          <th style="text-align: center;">ACTION</th>
        </tr>
      </thead>
      <tbody id="sipTableBody"></tbody>
    </table>
  </div>

  <!-- Master Data Source File -->
  <script src="data.js"></script>

  <script>
    let allSips = [];

    function initSipModule() {
      if (typeof plantMasterData !== 'undefined' && plantMasterData.sips) {
        allSips = plantMasterData.sips;
        renderSipRows(allSips);
      } else {
        document.getElementById('sipTableBody').innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 20px; color: #ef4444;">No SIP records found in data.js</td></tr>`;
      }
    }

    function renderSipRows(rows) {
      const tbody = document.getElementById('sipTableBody');
      document.getElementById('recordCount').innerText = `Total SIPs: ${rows.length}`;

      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 20px; color: #94a3b8;">No matching SIPs found.</td></tr>`;
        return;
      }

      let html = "";
      rows.forEach((r, idx) => {
        const partNo = r[0] || '-';
        const partName = r[1] || '-';
        const customer = r[2] || '-';
        const dwgNo = r[3] || '-';
        const rev = r[4] || '-';
        const driveLink = r[5] || '#';

        html += `
          <tr>
            <td style="text-align: center; color: #94a3b8; font-weight: 500;">${idx + 1}</td>
            <td style="font-weight: 700; color: #38bdf8;">${partNo}</td>
            <td style="font-weight: 600; color: #f8fafc;">${partName}</td>
            <td><span class="cust-badge">${customer}</span></td>
            <td style="color: #cbd5e1;">${dwgNo}</td>
            <td><span style="background: rgba(16, 185, 129, 0.15); color: #10b981; padding: 2px 7px; border-radius: 4px; font-weight: bold; font-size: 11px;">${rev}</span></td>
            <td style="text-align: center;">
              <a href="${driveLink}" target="_blank" class="btn-view-pdf">📄 Open SIP</a>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    function filterSips() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) {
        renderSipRows(allSips);
        return;
      }

      const filtered = allSips.filter(r => 
        (r[0] && r[0].toLowerCase().includes(q)) ||
        (r[1] && r[1].toLowerCase().includes(q)) ||
        (r[2] && r[2].toLowerCase().includes(q)) ||
        (r[3] && r[3].toLowerCase().includes(q))
      );
      renderSipRows(filtered);
    }

    window.addEventListener('DOMContentLoaded', initSipModule);
  </script>
</body>
</html>
