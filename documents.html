<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Central Document Hub - Milestone Gears Unit 7</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: #0b1120;
      color: #e2e8f0;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .top-bar {
      position: sticky;
      top: 0;
      background: #1e293b;
      border-bottom: 2px solid #f97316;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      z-index: 1000;
    }
    .nav-left { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      background: #0f172a;
      border: 1px solid #334155;
      color: #f97316;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
      font-size: 12px;
      transition: 0.2s;
    }
    .back-btn:hover { background: #f97316; color: white; }
    .nav-left h1 { font-size: 15px; margin: 0; color: #f8fafc; font-weight: 600; }

    .hub-container {
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      padding: 14px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Search & Filter Panel */
    .filter-panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .search-row { display: flex; gap: 10px; align-items: center; }
    .search-input-wrap { flex: 1; position: relative; }
    .search-input-wrap input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 9px 14px 9px 36px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }
    .search-input-wrap input:focus { border-color: #f97316; box-shadow: 0 0 0 2px rgba(249,115,22,0.25); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; color: #94a3b8; }

    .btn-reset {
      background: #334155;
      color: #cbd5e1;
      border: none;
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-reset:hover { background: #ef4444; color: white; }

    /* Category Filter Tabs */
    .category-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .cat-tab {
      background: #0f172a;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .cat-tab.active, .cat-tab:hover {
      background: #f97316;
      color: #fff;
      border-color: #f97316;
    }

    /* Documents Table Card */
    .table-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .table-header-meta {
      padding: 8px 14px;
      background: #111827;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #94a3b8;
    }
    .table-scroll { overflow-x: auto; max-height: 550px; }
    table { width: 100%; border-collapse: collapse; font-size: 11.5px; white-space: nowrap; text-align: left; }
    th {
      background: #0284c7;
      color: #ffffff;
      padding: 9px 12px;
      font-weight: 600;
      position: sticky;
      top: 0;
      border-bottom: 1px solid #0369a1;
      z-index: 10;
    }
    td { padding: 8px 12px; border-bottom: 1px solid #334155; color: #cbd5e1; }
    tr:nth-child(even) td { background: #1e293b; }
    tr:nth-child(odd) td { background: #0f172a; }
    tr:hover td { background: rgba(249, 115, 22, 0.1); color: #fff; }

    .btn-action-view {
      background: #0284c7;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: 0.2s;
    }
    .btn-action-view:hover { background: #0369a1; }

    .btn-action-dl {
      background: #10b981;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: 0.2s;
    }
    .btn-action-dl:hover { background: #059669; }

    .no-data { padding: 40px; text-align: center; color: #94a3b8; font-size: 13px; }

    /* Embedded In-App PDF/File Viewer Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .modal-content {
      background: #1e293b;
      border: 2px solid #f97316;
      border-radius: 10px;
      width: 100%;
      max-width: 1000px;
      height: 90vh;
      color: white;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    }
    .modal-header {
      padding: 12px 20px;
      background: #0f172a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .modal-body {
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .pdf-viewer-frame {
      width: 100%;
      flex: 1;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0f172a;
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="nav-left">
      <a href="index.html" class="back-btn">⬅ Home</a>
      <h1>📂 Central Document Hub</h1>
    </div>
    <span id="syncBadge" style="font-size: 11px; color: #34d399; font-weight: 600;">🟢 Live Master Sync</span>
  </header>

  <div class="hub-container">
    
    <!-- Search & Filter Panel -->
    <div class="filter-panel">
      <div class="search-row">
        <div class="search-input-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="docSearch" placeholder="Search across sheet data..." oninput="filterDocuments()">
        </div>
        <button class="btn-reset" onclick="resetFilters()">🔄 Reset</button>
      </div>

      <!-- Dynamic Category Tabs -->
      <div class="category-tabs" id="categoryTabs">
        <button class="cat-tab active" onclick="selectCategory('ALL', this)">All Documents</button>
      </div>
    </div>

    <!-- Documents Table -->
    <div class="table-card">
      <div class="table-header-meta">
        <span id="tableRecordCount">Showing 0 documents</span>
        <span style="font-size: 11px; color: #94a3b8;">Google Sheets Master Repository (GID: 2013659920)</span>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr id="tableHeaderRow">
              <th>Loading Headers...</th>
            </tr>
          </thead>
          <tbody id="documentTableBody">
            <tr><td colspan="6" class="no-data">Loading master documents from Google Sheets...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- In-App Preview Modal Popup -->
  <div class="modal-overlay" id="docModal">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h3 style="margin: 0; color: #f97316; font-size: 15px;" id="modalDocTitle">📑 Document Preview</h3>
          <span id="modalDocSub" style="font-size: 11px; color: #38bdf8; font-weight: 600;">-</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <a id="modalOpenExternal" href="#" target="_blank" style="background: #0284c7; color: white; padding: 5px 10px; border-radius: 5px; font-size: 11px; text-decoration: none; font-weight: 600;">↗ Open Full Tab</a>
          <button onclick="closeDocModal()" style="background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px;">✕ Close</button>
        </div>
      </div>
      <div class="modal-body">
        <iframe id="docPdfFrame" class="pdf-viewer-frame" src=""></iframe>
      </div>
    </div>
  </div>

  <script>
    // Locked Master CSV Link with GID 2013659920
    const DOCUMENT_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSIjTl05F8eko2YsYFg78qhfZg8vmdx1xYk29kNTnOn5C01lp78J0BuB3CP8OyT8C8qXhQv8PRVSwVK/pub?gid=2013659920&single=true&output=csv";

    let rawSheetRows = [];
    let sheetHeaders = [];
    let activeCategory = "ALL";

    function parseCSV(text) {
      let r = [], row = [''], q = false;
      for (let i = 0; i < text.length; i++) {
        let c = text[i], next = text[i + 1];
        if (c === '"') {
          if (q && next === '"') { row[row.length - 1] += '"'; i++; } else { q = !q; }
        } else if (c === ',' && !q) {
          row.push('');
        } else if ((c === '\r' || c === '\n') && !q) {
          if (c === '\r' && next === '\n') { i++; }
          if (row.length > 1 || (row.length === 1 && row[0] !== '')) r.push(row);
          row = [''];
        } else { row[row.length - 1] += c; }
      }
      if (row.length > 1 || (row.length === 1 && row[0] !== '')) r.push(row);
      return r.map(cols => cols.map(col => (col || '').trim()));
    }

    async function fetchCSVWithProxy(rawUrl) {
      const endpoints = [
        rawUrl,
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(rawUrl),
        "https://corsproxy.io/?" + encodeURIComponent(rawUrl),
        "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(rawUrl)
      ];
      for (const ep of endpoints) {
        try {
          const resp = await fetch(ep, { cache: 'no-store' });
          if (resp.ok) {
            const txt = await resp.text();
            if (txt && txt.length > 20 && !txt.includes("<!DOCTYPE html>")) return txt;
          }
        } catch (e) {}
      }
      return null;
    }

    function getDriveLinks(rawLink) {
      if (!rawLink || !rawLink.startsWith('http')) {
        return { view: '#', download: '#' };
      }
      let fileId = '';
      let match = rawLink.match(/\/d\/([a-zA-Z0-9_-]{15,})/);
      if (match) fileId = match[1];
      if (!fileId) {
        match = rawLink.match(/[?&]id=([a-zA-Z0-9_-]{15,})/);
        if (match) fileId = match[1];
      }

      if (fileId) {
        return {
          view: `https://drive.google.com/file/d/${fileId}/view`,
          embed: `https://drive.google.com/file/d/${fileId}/preview`,
          download: `https://drive.google.com/uc?export=download&id=${fileId}`
        };
      }
      return { view: rawLink, embed: rawLink, download: rawLink };
    }

    async function loadMasterDocuments() {
      const csvText = await fetchCSVWithProxy(DOCUMENT_CSV_URL);
      if (csvText) {
        const rows = parseCSV(csvText);
        if (rows.length > 0) {
          sheetHeaders = rows.shift();
          rawSheetRows = rows;
          
          buildDynamicHeaders();
          buildCategoryTabs();
        }
      }
      filterDocuments();
    }

    function buildDynamicHeaders() {
      const tr = document.getElementById('tableHeaderRow');
      let html = `<th>SR</th>`;
      sheetHeaders.forEach(h => {
        if(h) html += `<th>${h}</th>`;
      });
      html += `<th style="text-align: center;">ACTION (VIEW & DOWNLOAD)</th>`;
      tr.innerHTML = html;
    }

    function buildCategoryTabs() {
      const tabsContainer = document.getElementById('categoryTabs');
      let categories = new Set();
      
      rawSheetRows.forEach(r => {
        let docNo = r[2] || r[1] || '';
        let prefix = docNo.split('-')[0];
        if (prefix) categories.add(prefix.toUpperCase());
      });

      let tabsHtml = `<button class="cat-tab active" onclick="selectCategory('ALL', this)">All Documents</button>`;
      categories.forEach(cat => {
        if(cat.length <= 8) {
          tabsHtml += `<button class="cat-tab" onclick="selectCategory('${cat}', this)">${cat}</button>`;
        }
      });
      tabsContainer.innerHTML = tabsHtml;
    }

    function renderDocumentTable(data) {
      const tbody = document.getElementById('documentTableBody');
      document.getElementById('tableRecordCount').innerText = `Showing ${data.length} document${data.length === 1 ? '' : 's'}`;

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${sheetHeaders.length + 2}" class="no-data">🔍 No matching records found in sheet.</td></tr>`;
        return;
      }

      let html = "";
      data.forEach((r, idx) => {
        let rawLink = r[r.length - 1] && r[r.length - 1].startsWith('http') ? r[r.length - 1] : 'https://drive.google.com/';
        const links = getDriveLinks(rawLink);
        const docTitle = r[1] || `Document ${idx + 1}`;
        const docNo = r[2] || 'DOC';

        html += `<tr>`;
        html += `<td style="color: #94a3b8; font-weight: 500;">${idx + 1}</td>`;
        
        sheetHeaders.forEach((h, colIdx) => {
          let cellVal = r[colIdx] || '-';
          let style = (colIdx === 1 || colIdx === 2) ? "font-weight: 700; color: #38bdf8;" : "color: #cbd5e1;";
          html += `<td style="${style}">${cellVal}</td>`;
        });

        // In-App Popup View Button & Direct Download Button
        html += `
          <td style="text-align: center;">
            <div style="display: flex; gap: 6px; justify-content: center;">
              <button onclick="openDocModal('${docNo}', '${docTitle}', '${links.embed}', '${links.view}')" class="btn-action-view">👁️ View</button>
              <a href="${links.download}" class="btn-action-dl">📥 Download</a>
            </div>
          </td>
        `;
        html += `</tr>`;
      });
      tbody.innerHTML = html;
    }

    // Open In-App Modal Popup for PDF / File Preview
    function openDocModal(docNo, docTitle, embedUrl, viewUrl) {
      document.getElementById('modalDocTitle').innerText = `📑 ${docTitle}`;
      document.getElementById('modalDocSub').innerText = `Doc No: ${docNo}`;
      document.getElementById('docPdfFrame').src = embedUrl;
      document.getElementById('modalOpenExternal').href = viewUrl;
      document.getElementById('docModal').style.display = 'flex';
    }

    function closeDocModal() {
      document.getElementById('docPdfFrame').src = "";
      document.getElementById('docModal').style.display = 'none';
    }

    function selectCategory(cat, btnEl) {
      activeCategory = cat;
      document.querySelectorAll('.cat-tab').forEach(btn => btn.classList.remove('active'));
      btnEl.classList.add('active');
      filterDocuments();
    }

    function filterDocuments() {
      const query = document.getElementById('docSearch').value.toLowerCase().trim();
      const filtered = rawSheetRows.filter(r => {
        const rowString = r.join(' ').toLowerCase();
        const matchesQuery = rowString.includes(query);
        const matchesCat = (activeCategory === 'ALL' || rowString.includes(activeCategory.toLowerCase()));
        return matchesQuery && matchesCat;
      });
      renderDocumentTable(filtered);
    }

    function resetFilters() {
      document.getElementById('docSearch').value = '';
      const allBtn = document.querySelector('.cat-tab');
      if (allBtn) selectCategory('ALL', allBtn);
    }

    window.addEventListener('DOMContentLoaded', loadMasterDocuments);
  </script>
</body>
</html>
