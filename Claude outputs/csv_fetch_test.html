<title>CSV Fetch Test</title>
<style>
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --border: #e2e5ea;
    --text: #1a1d24;
    --text-dim: #6b7280;
    --accent: #2563eb;
    --good: #16a34a;
    --good-bg: #ecfdf3;
    --bad: #dc2626;
    --bad-bg: #fef2f2;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115;
      --surface: #171a21;
      --border: #2a2e38;
      --text: #e8eaed;
      --text-dim: #9099a8;
      --accent: #5b9dff;
      --good: #4ade80;
      --good-bg: #0e2618;
      --bad: #f87171;
      --bad-bg: #2a1414;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115;
    --surface: #171a21;
    --border: #2a2e38;
    --text: #e8eaed;
    --text-dim: #9099a8;
    --accent: #5b9dff;
    --good: #4ade80;
    --good-bg: #0e2618;
    --bad: #f87171;
    --bad-bg: #2a1414;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 20px 16px 32px;
  }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { color: var(--text-dim); font-size: 13px; margin: 0; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .status-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge {
    font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .badge.pending { background: var(--border); color: var(--text-dim); }
  .badge.ok { background: var(--good-bg); color: var(--good); }
  .badge.fail { background: var(--bad-bg); color: var(--bad); }
  .origin { font-family: var(--mono); font-size: 12px; color: var(--text-dim); word-break: break-all; }
  .msg { font-size: 13px; line-height: 1.5; }
  .msg.fail { color: var(--bad); }
  .msg.ok { color: var(--good); }
  pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-family: var(--mono); font-size: 11.5px; overflow-x: auto;
    margin: 0; max-height: 220px;
  }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; white-space: nowrap; }
  th { background: var(--bg); color: var(--text-dim); font-weight: 600; }
  .foot { color: var(--text-dim); font-size: 12px; }
</style>

<div class="wrap">
  <div>
    <h1>CSV Fetch Test</h1>
    <p class="sub">Checks whether the MS PRODUCTION LOG Google Sheet CSV can be fetched from a real https:// page (not a local file).</p>
  </div>

  <div class="card">
    <div class="status-row">
      <span class="badge pending" id="badge">● checking...</span>
      <span class="origin" id="originLine"></span>
    </div>
    <div class="msg" id="msg">Fetching CSV...</div>
    <pre id="preview" hidden></pre>
  </div>

  <p class="foot" id="footNote"></p>
</div>

<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSlzkPEhhw_GwdxwBsfM7BvWy0fqlFiVXM8WjC1fi3GIasaq2xcGmY7vUxxWTxdKtpENkxtA6MGjesF/pub?gid=892484788&single=true&output=csv";

  const badge = document.getElementById('badge');
  const msg = document.getElementById('msg');
  const preview = document.getElementById('preview');
  const originLine = document.getElementById('originLine');
  const footNote = document.getElementById('footNote');

  originLine.textContent = "page origin: " + (location.origin || location.href);

  function setResult(ok, text) {
    badge.className = 'badge ' + (ok ? 'ok' : 'fail');
    badge.textContent = ok ? '● success' : '● failed';
    msg.className = 'msg ' + (ok ? 'ok' : 'fail');
    msg.textContent = text;
  }

  (async () => {
    try {
      const res = await fetch(CSV_URL + "&_t=" + Date.now());
      if (!res.ok) {
        setResult(false, `HTTP ${res.status} (${res.statusText}) — sheet is not fetchable as-is from a browser.`);
        footNote.textContent = "This is not a null-origin issue (page is hosted), so the sheet's publish settings likely need a check.";
        return;
      }
      const text = await res.text();
      const peek = text.trim().slice(0, 20).toLowerCase();
      if (peek.startsWith('<!doctype') || peek.startsWith('<html')) {
        setResult(false, "Got an HTML/login page instead of CSV data — the sheet is not truly public yet.");
        footNote.textContent = "Fix: in Google Sheets, File → Share → Publish to web → pick the exact tab (not \"Entire Document\") → CSV → Publish again.";
        preview.hidden = false;
        preview.textContent = text.slice(0, 500);
        return;
      }
      const lines = text.trim().split('\n');
      setResult(true, `Fetched ${lines.length} row(s) successfully from a hosted https:// page.`);
      footNote.textContent = "This confirms the CSV link itself works fine — the earlier \"Failed to fetch\" was caused by opening the file locally (file:// origin blocks it), not by the Google Sheet.";
      preview.hidden = false;
      preview.textContent = lines.slice(0, 6).join('\n');
    } catch (err) {
      setResult(false, "fetch() threw: " + (err && err.message ? err.message : String(err)));
      footNote.textContent = "If this fails here too (on a real hosted page), the issue is on the Google Sheet's publish/sharing side, not the local-file restriction.";
    }
  })();
</script>
